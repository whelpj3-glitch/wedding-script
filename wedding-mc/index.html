<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<!-- app:start -->
<title>웨딩 MC 큐카드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: workspace notebook — sidebar of 식순 pages, one centered page per part, transport docked at the bottom */
:root{
  --bg:#ffffff; --side:#f7f7f5; --ink:#37352f; --ink-2:#6f6e69; --ink-3:#a19f9a; --line:#ebebea; --line-2:#e1e0dc;
  --hover:rgba(55,53,47,.06); --hover-2:rgba(55,53,47,.09); --sel:rgba(35,131,226,.12); --sel-line:rgba(35,131,226,.45);
  --accent:#2383e2; --accent-ink:#ffffff; --kar:#2383e2; --kar-done:#86b5e8; --active:rgba(35,131,226,.07);
  --t-gray-bg:#f1f1ef; --t-gray:#787774; --t-blue-bg:#e7f3f8; --t-blue:#337ea9; --t-green-bg:#edf3ec; --t-green:#448361;
  --t-red-bg:#fdebec; --t-red:#d44c47; --t-yellow-bg:#fbf3db; --t-yellow:#b7832b; --t-orange-bg:#fbecdd; --t-orange:#d9730d; --t-purple-bg:#f6f3f9; --t-purple:#9065b0;
  --callout:#f7f6f3; --shadow:0 0 0 1px rgba(15,15,15,.05),0 3px 6px rgba(15,15,15,.1),0 9px 24px rgba(15,15,15,.2);
  --f-ui:Inter,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",ui-sans-serif,system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --script-size:20px; --stage-size:34px; --dock-h:76px; --side-w:264px;
  --gut-l:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#191919; --side:#202020; --ink:rgba(255,255,255,.86); --ink-2:rgba(255,255,255,.56); --ink-3:rgba(255,255,255,.34); --line:#2b2b2b; --line-2:#373737;
  --hover:rgba(255,255,255,.055); --hover-2:rgba(255,255,255,.09); --sel:rgba(35,131,226,.24); --sel-line:rgba(82,156,236,.6);
  --accent:#529cec; --accent-ink:#ffffff; --kar:#6aaef5; --kar-done:#3d6a99; --active:rgba(82,156,236,.10);
  --t-gray-bg:#2f2f2f; --t-gray:#9b9b9b; --t-blue-bg:#1f3a4f; --t-blue:#5fa8d8; --t-green-bg:#1e3a2c; --t-green:#5cb58a;
  --t-red-bg:#4a2422; --t-red:#ee7b74; --t-yellow-bg:#46391a; --t-yellow:#e2b65a; --t-orange-bg:#4a301a; --t-orange:#ef9a4f; --t-purple-bg:#3a2d47; --t-purple:#b58ad6;
  --callout:#252525; --shadow:0 0 0 1px rgba(255,255,255,.06),0 3px 6px rgba(0,0,0,.4),0 9px 24px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#191919; --side:#202020; --ink:rgba(255,255,255,.86); --ink-2:rgba(255,255,255,.56); --ink-3:rgba(255,255,255,.34); --line:#2b2b2b; --line-2:#373737;
  --hover:rgba(255,255,255,.055); --hover-2:rgba(255,255,255,.09); --sel:rgba(35,131,226,.24); --sel-line:rgba(82,156,236,.6);
  --accent:#529cec; --accent-ink:#ffffff; --kar:#6aaef5; --kar-done:#3d6a99; --active:rgba(82,156,236,.10);
  --t-gray-bg:#2f2f2f; --t-gray:#9b9b9b; --t-blue-bg:#1f3a4f; --t-blue:#5fa8d8; --t-green-bg:#1e3a2c; --t-green:#5cb58a;
  --t-red-bg:#4a2422; --t-red:#ee7b74; --t-yellow-bg:#46391a; --t-yellow:#e2b65a; --t-orange-bg:#4a301a; --t-orange:#ef9a4f; --t-purple-bg:#3a2d47; --t-purple:#b58ad6;
  --callout:#252525; --shadow:0 0 0 1px rgba(255,255,255,.06),0 3px 6px rgba(0,0,0,.4),0 9px 24px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(100px + env(safe-area-inset-top,0px));scroll-padding-bottom:calc(var(--dock-h) + 24px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--bg)}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sel-line);outline-offset:1px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}

/* ---------- buttons & tags ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:0 10px;border-radius:6px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);font-weight:500;font-size:14px;white-space:nowrap;transition:background .12s}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06);background:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn.danger{color:var(--t-red)}
.btn.sm{min-height:28px;padding:0 8px;font-size:13px}
.btn svg{width:16px;height:16px;flex:none}
.tag{display:inline-flex;align-items:center;gap:4px;padding:0 6px;height:22px;border-radius:4px;font-size:13px;font-weight:500;white-space:nowrap;background:var(--t-gray-bg);color:var(--t-gray)}
.tag.blue{background:var(--t-blue-bg);color:var(--t-blue)} .tag.green{background:var(--t-green-bg);color:var(--t-green)} .tag.red{background:var(--t-red-bg);color:var(--t-red)}
.tag.yellow{background:var(--t-yellow-bg);color:var(--t-yellow)} .tag.orange{background:var(--t-orange-bg);color:var(--t-orange)} .tag.purple{background:var(--t-purple-bg);color:var(--t-purple)}
.kbd{font-family:var(--f-num);font-size:12px;padding:0 5px;border:1px solid var(--line-2);border-radius:4px;color:var(--ink-2)}

/* ---------- sidebar ---------- */
.side{position:fixed;top:0;bottom:0;left:0;width:var(--side-w);background:var(--side);border-right:1px solid var(--line);z-index:70;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px)}
.side-scroll{flex:1;overflow:auto;padding:8px 6px 16px}
.ws{display:flex;align-items:center;gap:8px;padding:10px 10px 6px}
.ws-ic{width:24px;height:24px;border-radius:5px;display:grid;place-items:center;background:var(--t-red-bg);font-size:14px;flex:none}
.ws-t{flex:1;min-width:0}
.ws-t b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-t small{display:block;font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-t small b{display:inline;font-size:12px;color:var(--t-red)}
.nav{display:flex;align-items:center;gap:8px;width:100%;min-height:30px;padding:3px 10px;border:0;border-radius:6px;background:transparent;color:var(--ink-2);font-size:14px;font-weight:500;text-align:left}
.nav:hover{background:var(--hover-2)}
.nav.on{background:var(--hover-2);color:var(--ink)}
.nav .ic{width:20px;text-align:center;flex:none;font-size:15px}
.nav .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .meta{font-size:12px;color:var(--ink-3);font-weight:400}
.nav .ok{color:var(--t-green);font-weight:700}
.nav .n{font-family:var(--f-num);font-size:11px;color:var(--ink-3);width:18px;flex:none}
.grp{display:flex;align-items:center;justify-content:space-between;padding:16px 10px 4px;font-size:12px;font-weight:600;color:var(--ink-3)}
.grp button{border:0;background:none;color:var(--ink-3);border-radius:4px;padding:0 6px;font-size:15px}
.grp button:hover{background:var(--hover-2);color:var(--ink)}
.side-foot{border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.progress{height:4px;border-radius:2px;background:var(--hover-2);overflow:hidden;margin:6px 10px 2px}
.progress i{display:block;height:100%;background:var(--t-green)}
.backdrop{position:fixed;inset:0;background:rgba(15,15,15,.45);z-index:65}
.side{transform:translateX(-102%);transition:transform .22s ease;box-shadow:var(--shadow);width:min(86vw,320px)}
.side.open{transform:none}
@media (min-width:520px){ body.pinned .side{transform:none;box-shadow:none;width:var(--side-w)} body.pinned .shell{margin-left:var(--side-w)} body.pinned .dock{left:var(--side-w)!important} body.pinned .backdrop{display:none!important} }
@media (min-width:520px) and (max-width:999px){ :root{--side-w:212px} .side .nav{font-size:13.5px} }
@media (min-width:1000px){ .only-narrow{display:none!important} }
@media (max-width:999px){ .only-wide{display:none!important} }
.pin{border:0;background:none;border-radius:4px;padding:2px 6px;font-size:14px;color:var(--ink-3);filter:grayscale(1);opacity:.7}
.pin:hover{background:var(--hover-2)}
.pin[aria-pressed="true"]{filter:none;opacity:1}
.chipbar{display:none;gap:4px;overflow-x:auto;padding-block:6px;padding-left:var(--gut-l);padding-right:var(--gut-r);border-bottom:1px solid var(--line);background:var(--bg);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chipbar::-webkit-scrollbar{display:none}
@media (max-width:519px){ body.pinned .head .chipbar{display:flex} }
.stage .chipbar{display:flex}
.chipbar button{flex:none;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-2);background:var(--bg);border-radius:6px;padding:4px 9px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.chipbar button:hover{background:var(--hover)}
.chipbar button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chipbar .n{font-family:var(--f-num);font-size:11px;opacity:.7}
.chipbar .ok{color:var(--t-green);font-weight:700}
.chipbar button.on .ok{color:inherit}

/* ---------- top bar ---------- */
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.top{background:var(--bg);display:flex;align-items:center;gap:6px;min-height:46px;padding-block:6px;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.crumb{flex:1;min-width:0;display:flex;align-items:center;gap:4px;font-size:14px;color:var(--ink-2);overflow:hidden;white-space:nowrap}
.crumb button{border:0;background:none;padding:2px 6px;border-radius:4px;color:inherit;max-width:44%;overflow:hidden;text-overflow:ellipsis}
.crumb button:hover{background:var(--hover)}
.crumb .cur{color:var(--ink);max-width:56%}
.crumb .sl{color:var(--ink-3)}

/* ---------- page ---------- */
.page{max-width:820px;margin:0 auto;padding-top:28px;padding-bottom:calc(var(--dock-h) + 80px + env(safe-area-inset-bottom,0px));padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
@media (min-width:700px){ .page{padding-left:72px;padding-right:72px;padding-top:56px} }
.p-icon{font-size:56px;line-height:1;margin-bottom:10px}
.p-title{font-size:clamp(28px,5vw,40px);font-weight:700;line-height:1.2;margin:0 0 6px;letter-spacing:-.01em;text-wrap:balance;word-break:keep-all}
.p-title small{font-size:15px;font-weight:500;color:var(--ink-3);margin-left:10px;letter-spacing:0;vertical-align:middle}
input.p-title{border:0;background:transparent;width:100%;padding:0;outline:none}
.props{display:grid;gap:2px;margin:14px 0 6px}
.prop{display:grid;grid-template-columns:132px minmax(0,1fr);align-items:center;min-height:34px;font-size:14px}
.prop .k{display:flex;align-items:center;gap:7px;color:var(--ink-2);padding:0 6px}
.prop .k i{font-style:normal;width:16px;text-align:center;color:var(--ink-3)}
.prop .v{min-width:0;padding:4px 6px;border-radius:4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.prop .v:hover{background:var(--hover)}
.prop input.pv{border:0;background:transparent;width:100%;padding:0;outline:none;font-size:14px}
.prop input.pv::placeholder{color:var(--ink-3)}
.prop .v .tag{max-width:100%;overflow:hidden;text-overflow:ellipsis;display:inline-block;line-height:22px}
@media (max-width:699px){ .p-icon{font-size:44px} }
.prop .v button.link{border:0;background:none;color:var(--accent);padding:0;font-size:14px}
@media (max-width:480px){ .prop{grid-template-columns:104px minmax(0,1fr)} }
.callout{display:flex;gap:10px;padding:14px 16px;border-radius:6px;background:var(--callout);margin:14px 0;font-size:14.5px;line-height:1.6}
.callout .ci{font-size:18px;line-height:1.3}
.callout.blue{background:var(--t-blue-bg)} .callout.red{background:var(--t-red-bg)}
.h2{font-size:20px;font-weight:600;margin:34px 0 8px;display:flex;align-items:center;gap:8px}
.views{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 4px;overflow-x:auto}
.views button{border:0;background:none;padding:8px 10px 9px;font-size:14px;font-weight:500;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.views button:hover{color:var(--ink)}
.views button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.hint{font-size:13px;color:var(--ink-3);margin:10px 0 0}
.check{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

/* ---------- script blocks ---------- */
.blocks{display:flex;flex-direction:column;padding-top:10px}
.blk{position:relative;padding:3px 6px 3px 26px;margin-left:-6px;border-radius:4px;font-size:var(--script-size);line-height:1.7;word-break:keep-all;overflow-wrap:anywhere;--bi:var(--ink);color:var(--bi)}
@media (min-width:700px){ .blk{padding-left:6px;margin-left:-6px} .blk>.tg,.blk>.handle{left:-24px} }
.blk.gap{margin-top:14px}
.blk-main .kt{display:inline}
.blk-main .kt span.f{color:var(--kar)}
.blk[data-st="done"] .kt span.f{color:var(--kar-done)}
.blk-main .kt span.c{background-image:linear-gradient(90deg,var(--kar) var(--p,0%),var(--bi) var(--p,0%));-webkit-background-clip:text;background-clip:text;color:transparent}
.blk[data-type="shout"]{font-weight:700}
.blk[data-type="dir"],.blk[data-type="note"]{font-size:calc(var(--script-size)*.74);line-height:1.55;--bi:var(--ink-3);padding-top:6px}
.blk[data-type="note"] .kt::before{content:"※ "}
.blk[data-type="cue"]{font-size:calc(var(--script-size)*.74);line-height:1.55;padding-top:5px;padding-bottom:5px}
.cue-pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:4px;background:var(--t-red-bg);--bi:var(--t-red);color:var(--t-red);font-weight:600}
.blk[data-type="adlib"] .kt{--bi:var(--t-yellow);color:var(--t-yellow)}
.adlib-tag{font-size:12px;font-weight:600;color:var(--t-yellow);background:var(--t-yellow-bg);padding:1px 6px;border-radius:4px;margin-right:8px;vertical-align:2px}
.sec-off .blk[data-type="say"],.sec-off .blk[data-type="shout"]{--bi:var(--t-green)}
.blk.cursor{background:var(--sel)}
.blk[data-st="on"]{background:var(--active)}
.blk[data-st="done"]{--bi:var(--ink-2)}
.blk[data-st="soon"]{box-shadow:inset 2px 0 0 var(--accent)}
.blk-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:2px 0 1px;font-size:12px;line-height:1.4}
.chipbtn{display:inline-flex;align-items:center;gap:4px;border:0;padding:1px 7px;border-radius:4px;background:var(--t-gray-bg);color:var(--t-gray);font-family:var(--f-num);font-size:12px;font-weight:500}
.chipbtn:hover{color:var(--accent)}
.cd{display:none;font-family:var(--f-num);font-size:12px;font-weight:600;color:var(--accent)}
.blk[data-st="soon"] .cd{display:inline}
/* toggle + handle in the gutter, Notion style */
.tg,.handle{position:absolute;left:2px;top:calc(var(--script-size)*.24);width:22px;height:22px;border:0;border-radius:4px;background:none;color:var(--ink-3);display:grid;place-items:center;padding:0;font-size:12px}
.blk[data-type="dir"]>.tg,.blk[data-type="note"]>.tg,.blk[data-type="cue"]>.tg{top:5px}
.tg:hover,.handle:hover{background:var(--hover-2);color:var(--ink)}
.tg svg{width:12px;height:12px;transition:transform .15s}
.tg[aria-expanded="true"] svg{transform:rotate(90deg)}
.tg.has{color:var(--t-orange)}
.handle{opacity:0;font-size:14px;letter-spacing:-2px}
@media (hover:hover){ .ctx-read .blk:hover>.handle{opacity:1} }
.ctx-read .blk.cursor>.handle{opacity:1}
.memo{display:flex;gap:8px;margin:4px 0 8px;padding:8px 10px;border-radius:6px;background:var(--callout);font-size:14px;line-height:1.6;color:var(--ink);font-weight:400}
.memo .mi{flex:none;font-size:14px;line-height:1.6;color:var(--t-orange)}
.memo textarea,.memo .mt{flex:1;min-width:0;border:0;background:transparent;resize:none;padding:0;outline:none;font-size:14px;line-height:1.6;overflow:hidden;white-space:pre-wrap;word-break:keep-all}
.st-body .memo{font-size:calc(var(--stage-size)*.5)}
.st-body .memo .mt{font-size:inherit}
/* inline editing */
textarea.inl{display:block;width:100%;border:0;outline:none;background:transparent;resize:none;padding:0;margin:0;font:inherit;line-height:inherit;color:var(--ink);overflow:hidden;word-break:keep-all}
.blk.editing{background:var(--hover);box-shadow:inset 0 0 0 1px var(--sel-line)}
.bar{display:flex;flex-wrap:wrap;gap:2px;margin:6px 0 4px;padding:3px;width:max-content;max-width:100%;border-radius:6px;background:var(--bg);box-shadow:var(--shadow);font-size:13px;line-height:1}
.bar button{border:0;background:none;padding:6px 8px;border-radius:4px;color:var(--ink);font-size:13px;white-space:nowrap}
.bar button:hover{background:var(--hover-2)}
.bar .sep{width:1px;background:var(--line);margin:3px 2px}
.bar .del{color:var(--t-red)}
.add-row{display:flex;align-items:center;gap:6px;width:100%;border:0;background:none;color:var(--ink-3);padding:6px 6px;margin-top:6px;border-radius:4px;font-size:14px;text-align:left}
.add-row:hover{background:var(--hover);color:var(--ink-2)}
.empty-off{padding:22px 18px;border-radius:6px;background:var(--t-green-bg);color:var(--t-green);font-size:14.5px;display:flex;gap:10px}
.empty-off b{display:block;font-size:16px}

/* timing ctx */
.ctx-timing .blk{cursor:pointer}
.ctx-timing .blk::before{content:"";position:absolute;left:5px;top:calc(var(--script-size)*.42);width:14px;height:14px;border-radius:3px;border:1.5px solid var(--line-2);background:var(--bg)}
@media (min-width:700px){ .ctx-timing .blk::before{left:-20px} }
.ctx-timing .blk[data-type="dir"]::before,.ctx-timing .blk[data-type="note"]::before,.ctx-timing .blk[data-type="cue"]::before{top:9px}
.ctx-timing .blk.sel{background:var(--sel)}
.ctx-timing .blk.sel::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 2.5px var(--bg)}
.timeline{position:relative;height:30px;margin:12px 0 4px;border-radius:6px;background:var(--hover);overflow:hidden;cursor:pointer;touch-action:none}
.timeline .seg-t{position:absolute;top:6px;bottom:6px;border-radius:3px;background:var(--kar-done)}
.timeline .seg-t.sel{background:var(--accent)}
.timeline .ph{position:absolute;top:0;bottom:0;width:2px;background:var(--t-red);transform:translateX(-1px)}
.timeline-scale{display:flex;justify-content:space-between;font-family:var(--f-num);font-size:11px;color:var(--ink-3)}
.ctx-read .blk,.ctx-stage .blk{cursor:pointer}

/* toggles: backup scripts & lists */

<script>
'use strict';
/* ============================================================
   Utilities
   ============================================================ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(t,dec){ if(t==null||!isFinite(t)) return '–'; const neg=t<0; t=Math.abs(t); let m=Math.floor(t/60), s=t-m*60;
  let ss; if(dec){ ss=s.toFixed(1); if(ss==='60.0'){m++;ss='0.0';} ss=ss.padStart(4,'0'); } else ss=String(Math.floor(s)).padStart(2,'0');
  return (neg?'-':'')+m+':'+ss; }
function fmtDur(t){ t=Math.round(t); if(t<60) return t+'초'; const m=Math.floor(t/60), s=t%60; return s?`${m}분 ${s}초`:`${m}분`; }
function parseTime(str){ str=String(str??'').trim(); if(!str) return null; const m=str.match(/^(\d+)\s*:\s*(\d{1,2}(?:\.\d+)?)$/); if(m) return +m[1]*60 + +m[2]; const n=parseFloat(str.replace(/[^\d.]/g,'')); return isFinite(n)?n:null; }
const median=a=>{ if(!a.length) return 0; const b=[...a].sort((x,y)=>x-y); return b[Math.floor(b.length/2)]; };
function once(el,ev,ms){ return new Promise(res=>{ let done=false; const f=()=>{ if(done) return; done=true; el.removeEventListener(ev,f); res(); }; el.addEventListener(ev,f); setTimeout(f,ms||3000); }); }
let toastT; function toast(msg,ms){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, ms||2400); }
function autosize(ta){ ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; }
const I={
  play:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>',
  pause:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z" fill="currentColor"/></svg>',
  tri:'<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2.5l4.5 3.5L4 9.5z" fill="currentColor"/></svg>'
};
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>{ s.remove(); rej(new Error('load '+src)); }; document.head.appendChild(s); }); }
async function loadFirst(list,test){ if(test()) return; let err; for(const src of list){ try{ await loadScript(src); if(test()) return; }catch(e){ err=e; } } throw err||new Error('load'); }
function busy(msg){ let el=$('#busy'); if(msg==null){ el&&el.remove(); return; } if(!el){ el=document.createElement('div'); el.id='busy'; el.className='busy'; el.innerHTML='<div></div>'; document.body.appendChild(el); } el.firstChild.textContent=msg; }
async function saveFile(name,blob){
  try{ if(window.claude&&typeof window.claude.use==='function'){ const d=await window.claude.use('downloads'); if(d){ await d.save({filename:name,data:blob}); return 'saved'; } } }
  catch(e){ if(e&&e.code==='declined') return 'declined'; if(e&&e.code==='rate_limited'){ toast('잠시 후 다시 시도해 주세요.'); return 'declined'; } }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),60000); return 'saved'; }catch(e){ return 'failed'; } }

/* ============================================================
   Storage (IndexedDB with in-memory fallback)
   ============================================================ */
const Store={ db:null, mem:{kv:new Map(),audio:new Map()},
  async init(){ try{ this.db=await new Promise((res,rej)=>{ const r=indexedDB.open('wedding-mc',1); r.onupgradeneeded=()=>{ const d=r.result; d.createObjectStore('kv'); d.createObjectStore('audio'); }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); setTimeout(()=>rej(new Error('idb timeout')),3000); }); }catch(e){ this.db=null; } },
  async get(st,k){ if(this.mem[st].has(k)) return this.mem[st].get(k); if(!this.db) return undefined; try{ return await new Promise((res,rej)=>{ const q=this.db.transaction(st).objectStore(st).get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }catch(e){ return undefined; } },
  async put(st,k,v){ this.mem[st].set(k,v); if(!this.db) return; try{ await new Promise((res,rej)=>{ const tx=this.db.transaction(st,'readwrite'); tx.objectStore(st).put(v,k); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); }); }catch(e){ console.warn('save failed',e); if(st==='audio') toast('음악 파일을 기기에 저장하지 못했어요. 이번 접속 동안만 사용됩니다.'); } },
  async del(st,k){ this.mem[st].delete(k); if(!this.db) return; try{ await new Promise((res)=>{ const tx=this.db.transaction(st,'readwrite'); tx.objectStore(st).delete(k); tx.oncomplete=res; tx.onerror=res; }); }catch(e){} }
};

/* ============================================================
   State
   ============================================================ */
let P=null;
const S={fontSize:20, stageSize:34, cps:5, autoScroll:true, theme:'system', rate:1, pinSide:true};
const UI={view:'home', secId:null, mode:'read', selA:null, selB:null, multi:false, cursor:-1, stage:false, hold:null, editing:null};
let saveT;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{ Store.put('kv','project',JSON.parse(JSON.stringify(P))); Store.put('kv','settings',{...S}); },250); }
const sec=()=>P.sections.find(s=>s.id===UI.secId)||P.sections[0];
const secIdx=()=>P.sections.indexOf(sec());
function mkBlock(text,gap){ return {id:uid(), text:String(text).trim(), gap:!!gap, s:null, e:null, memo:'', memoOpen:false}; }
function newSection(o={}){ return {id:uid(), title:o.title||'새 순서', memo:o.memo||'', role:o.role||'mc', note:o.note||'', trackId:o.trackId||null, trackStart:o.trackStart||0, done:false, sosOpen:false,
  backups:o.backups||null, blocks:(o.blocks||[]).map(b=>typeof b==='string'?mkBlock(b):b)}; }
const ROLE_LABEL={mc:'사회자', off:'주례자', other:'기타'};
const ROLE_TAG={mc:'blue', off:'green', other:'gray'};
function secIcon(t){ const m=[[/하객|안내|식전/,'📢'],[/개식/,'🔔'],[/화촉|점화/,'🕯️'],[/신랑.*입장/,'🤵'],[/신부.*입장/,'👰'],[/입장/,'🚪'],[/맞절/,'🙇'],[/목사|주례.*소개|소개/,'⛪'],[/성경|봉독/,'📖'],[/설교|말씀|주례사/,'🗣️'],[/서약/,'💍'],[/축복기도|기도/,'🙏'],[/축도/,'🙌'],[/성혼|선언|선포/,'📜'],[/축가/,'🎤'],[/축사|편지/,'✉️'],[/인사/,'💐'],[/행진/,'🎊'],[/폐식/,'🎉'],[/영상/,'🎬'],[/사회자|멘트/,'🎙️']];
  for(const [r,i] of m) if(r.test(t)) return i; return '📄'; }

/* block typing — the script's own conventions: (지시문) *음향 큐* ~애드리브~ 구호! */
const CUE_RE=/(ON|OFF|재생|정지|큐|BGM|MR|영상|음악|곡|조명|암전|스톱)/i;
function btype(t){ const s=(t||'').trim();
  if(/^\*.+\*$/.test(s)) return CUE_RE.test(s)?'cue':'note';
  if(/^[※*]/.test(s)) return 'note';
  if(/^\(.*\)$/.test(s)||/^\[.*\]$/.test(s)) return 'dir';
  if(/^~.+~$/.test(s)) return 'adlib';
  if(s.length<=32&&/!$/.test(s)) return 'shout';
  return 'say'; }
const SPOKEN=new Set(['say','shout','adlib']);
function shownText(t){ const ty=btype(t); let s=t.trim(); if(ty==='cue'||(ty==='note'&&/^\*.*\*$/.test(s))) s=s.replace(/^\*+\s*|\s*\*+$/g,''); else if(ty==='note') s=s.replace(/^[※*]\s*/,''); else if(ty==='adlib') s=s.replace(/^~\s*|\s*~$/g,''); return s; }
function spokenLen(t){ return t.replace(/[\s.,!?~*()\[\]…·"'“”‘’\-:;]/g,'').length; }
function estBlock(b){ const ty=btype(b.text); if(!SPOKEN.has(ty)) return 0; if(ty==='adlib') return 8; return spokenLen(b.text)/S.cps+0.5; }
function estSection(s){ return s.role==='off'?0:s.blocks.reduce((a,b)=>a+estBlock(b),0); }
function charW(ch){ if(/\s/.test(ch)) return .35; if(/[.,!?…]/.test(ch)) return 1.5; return 1; }

    BK('장내가 소란스러울 때','내빈 여러분, 잠시 주목해 주시겠습니까? 이제 곧 두 사람의 결혼식을 시작하겠습니다. 휴대폰은 진동으로 바꿔 주시고 앞쪽을 바라봐 주시기 바랍니다.'),

  if(/신부.*입장/.test(t)) return [
    BK('입장곡이 나오지 않을 때','오늘 가장 아름다운 신부를 여러분의 박수로 맞이해 주시겠습니까? 큰 박수 부탁드립니다. 신부, 입장!'),
    BK('드레스·동선 정리로 지연될 때','신부가 가장 아름다운 모습으로 입장하기 위해 마지막 준비를 하고 있습니다. 조금만 기다려 주시기 바랍니다.'),
    BK('아버님 포옹이 길어질 때','딸을 보내는 아버님의 마음이 그대로 전해지는 순간입니다. 따뜻한 박수로 함께해 주시기 바랍니다.'),

  if(s.role==='off'||/성경|설교|기도|축도|성혼|선언|선포|말씀/.test(t)) return [

  return [BK('진행이 잠시 멈췄을 때','잠시 준비하는 동안, 오늘 두 사람에게 축하의 박수 한 번 더 보내 주시겠습니까?')]; }
function defaultCommon(){ return [
  BK('마이크가 안 나올 때','(마이크 교체 신호 후 육성으로 크게) 잠시 마이크 점검이 있겠습니다. 바로 이어서 진행하겠습니다.'),

const PDFJS=[['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'],

function noteTokens(s){ return (s||'').toLowerCase().split(/[^0-9a-z가-힣]+/).filter(w=>w.length>=3&&!['bgm','mp3','the','and','입장곡','행진곡'].includes(w)); }
function matchScore(note,tr){ const f=normName(tr.fileName+' '+tr.name); let sc=0; for(const w of noteTokens(note)) if(f.includes(w)) sc+=w.length; return sc; }
function autoMatch(force){ let n=0; for(const s of P.sections){ if(!s.note||(s.trackId&&!force)) continue; let best=null,bs=0; for(const t of P.tracks){ const sc=matchScore(s.note,t); if(sc>bs){bs=sc;best=t;} } if(best&&bs>=5){ if(s.trackId!==best.id) n++; s.trackId=best.id; } } return n; }
function audioDuration(url){ return new Promise(res=>{ const a=new Audio(); a.preload='metadata'; a.onloadedmetadata=()=>res(a.duration||0); a.onerror=()=>res(0); a.src=url; setTimeout(()=>res(a.duration||0),6000); }); }
async function addAudioFiles(files){ let added=0;
  for(const f of files){ const id=uid(); await Store.put('audio',id,f); const u=URL.createObjectURL(f); urlCache.set(id,u);
    const duration=await audioDuration(u); P.tracks.push({id,name:f.name.replace(/\.[^.]+$/,''),fileName:f.name,duration}); added++; }
  const n=autoMatch(false); save(); await Clock.bind(sec()); render();
  toast(`음악 ${added}곡 추가${n?` · ${n}개 순서에 자동 연결`:''}`); }

/* ============================================================
   Clock — the section's music, or a stopwatch when it has none
   ============================================================ */
const Clock={ mode:'watch', trackId:null, secId:null, wBase:0, wStart:0, wOn:false,
  async bind(s){ this.secId=s?s.id:null; this.wOn=false; this.wBase=0;
    const tr=s&&s.trackId?P.tracks.find(t=>t.id===s.trackId):null; const url=tr?await trackURL(tr.id):null;
    if(url){ if(this.trackId!==tr.id){ audio.pause(); audio.src=url; this.trackId=tr.id; await once(audio,'loadedmetadata',4000); } else audio.pause();
      this.mode='audio'; try{ audio.currentTime=s.trackStart||0; }catch(e){} audio.playbackRate=S.rate; }
    else { audio.pause(); this.mode='watch'; this.trackId=null; }
    kick(); },
  hasTrack(){ return this.mode==='audio'; },
  time(){ return this.mode==='audio'?audio.currentTime:(this.wOn?this.wBase+(performance.now()-this.wStart)/1000*S.rate:this.wBase); },
  playing(){ return this.mode==='audio'?!audio.paused:this.wOn; },
  play(){ if(this.mode==='audio'){ audio.playbackRate=S.rate; audio.play().catch(()=>toast('재생하지 못했어요. 다시 눌러 주세요.')); } else if(!this.wOn){ this.wStart=performance.now(); this.wOn=true; } kick(); },
  pause(){ if(this.mode==='audio') audio.pause(); else if(this.wOn){ this.wBase=this.time(); this.wOn=false; } kick(); },
  toggle(){ this.playing()?this.pause():this.play(); },
  seek(t){ t=Math.max(0,t); if(this.mode==='audio'){ const d=audio.duration; audio.currentTime=isFinite(d)?Math.min(t,d-0.05):t; } else { this.wBase=t; this.wStart=performance.now(); } kick(); },
  duration(){ if(this.mode==='audio') return isFinite(audio.duration)?audio.duration:0; const s=sec(); const m=s?Math.max(0,...s.blocks.map(b=>b.e||0)):0; return Math.max(60,Math.ceil((m+15)/10)*10); },
  setRate(r){ S.rate=r; if(this.mode==='watch'&&this.wOn){ this.wBase=this.time(); this.wStart=performance.now(); } audio.playbackRate=r; save(); }
};
['play','pause','seeked','ended','loadedmetadata','timeupdate'].forEach(ev=>audio.addEventListener(ev,kick));

/* ============================================================
   Karaoke engine
   ============================================================ */
let raf=0;
function kick(){ if(!raf) raf=requestAnimationFrame(tick); }
function tick(){ raf=0; updateKaraoke(); updatePlayer(); if(Clock.playing()||UI.hold) raf=requestAnimationFrame(tick); }
function prepKar(el,text){ const kt=el.querySelector('.kt'); if(!kt) return; kt.textContent=''; const spans=[], cum=[]; let acc=0;
  for(const ch of text){ const sp=document.createElement('span'); sp.textContent=ch; kt.appendChild(sp); spans.push(sp); acc+=charW(ch); cum.push(acc); }
  el._spans=spans; el._cum=cum; el._i=0; }
function fillTo(el,p){ const cum=el._cum, spans=el._spans; if(!spans||!spans.length) return; const total=cum[cum.length-1], target=clamp(p,0,1)*total;
  let lo=0,hi=cum.length; while(lo<hi){ const mid=(lo+hi)>>1; if(cum[mid]<=target) lo=mid+1; else hi=mid; } const i=lo;
  if(i!==el._i){ const a=Math.min(i,el._i), b=Math.max(i,el._i); for(let j=a;j<b;j++) spans[j].classList.toggle('f',j<i); if(spans[el._i]) spans[el._i].classList.remove('c'); el._i=i; }
  if(i<spans.length){ const prev=i?cum[i-1]:0; const frac=(target-prev)/(cum[i]-prev||1); if(frac>0.02){ spans[i].classList.add('c'); spans[i].style.setProperty('--p',(frac*100).toFixed(1)+'%'); } else spans[i].classList.remove('c'); } }
function paint(el,b,t,playing){ let st; if(t<b.s) st=(playing&&t>=b.s-3)?'soon':'wait'; else if(t<b.e) st='on'; else st='done';
  if(el.dataset.st!==st){ const was=el.dataset.st; el.dataset.st=st; if(st==='on'&&was!=='on'&&S.autoScroll&&playing&&el.offsetParent) el.scrollIntoView({block:'center',behavior:'smooth'}); }
  if(st==='soon'){ const cd=el.querySelector('.cd'); if(cd) cd.textContent=`${Math.ceil(b.s-t)}초 후 시작`; }
  fillTo(el, st==='on'?(t-b.s)/(b.e-b.s):st==='done'?1:0); }
function updateKaraoke(){ const t=Clock.time(), pl=Clock.playing();
  for(const box of [$('#blocks'), UI.stage?$('#stBody .blocks'):null]){ if(!box||!box._sec||box._sec.id!==Clock.secId) continue;
    for(const el of box.querySelectorAll('.blk[data-timed]')) if(el._b&&el._b.s!=null&&!el.classList.contains('editing')) paint(el,el._b,t,pl); }
  const tl=$('#timeline'); if(tl){ const d=Clock.duration()||1; const ph=tl.querySelector('.ph'); if(ph) ph.style.left=(clamp(t/d,0,1)*100)+'%'; }
  if(UI.hold){ const hb=$('#holdBtn'); if(hb) hb.textContent=`읽는 중… ${fmt(t-UI.hold.s,true)}  (손을 떼면 저장)`; } }

/* ============================================================

function render(){ renderSide(); renderCrumb(); renderPage(); renderDock(); if(UI.stage) renderStage(); }
function eventText(short){ if(!P.eventAt) return ''; const d=new Date(P.eventAt); if(isNaN(d)) return ''; const now=new Date();
  const h=d.getHours(), ds=`${d.getMonth()+1}월 ${d.getDate()}일(${'일월화수목금토'[d.getDay()]}) ${h<12?'오전':'오후'} ${((h+11)%12)+1}:${String(d.getMinutes()).padStart(2,'0')}`;
  const day=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime(); const days=Math.round((day(d)-day(now))/864e5); const diff=d-now; let dd;
  if(days>0) dd=`D-${days}`; else if(diff>0){ const hh=Math.floor(diff/36e5), mm=Math.floor(diff%36e5/6e4); dd=`D-day · ${hh?hh+'시간 ':''}${mm}분 남음`; } else if(diff>-3*36e5) dd='예식 진행 중'; else dd='예식 종료';
  return short?`<b>${dd}</b> · ${ds}`:{dd,ds}; }

function startEdit(idx,caret){ const s=sec(); const b=s.blocks[idx]; const el=$(`#blocks .blk[data-idx="${idx}"]`); if(!b||!el) return;
  UI.cursor=idx; UI.editing=b.id; el.classList.add('editing'); el.querySelector('.bar')?.remove(); el.removeAttribute('data-st');
  const main=el.querySelector('.blk-main'); main.innerHTML=''; const ta=document.createElement('textarea'); ta.className='inl'; ta.rows=1; ta.value=b.text; ta.setAttribute('aria-label','문장 수정'); main.appendChild(ta);
  autosize(ta); ta.focus(); const p=caret==='start'?0:ta.value.length; try{ ta.setSelectionRange(p,p); }catch(e){}
  let done=false;
  const commit=(after)=>{ if(done) return; done=true; UI.editing=null; const t=ta.value.replace(/\s*\n\s*/g,' ').trim(); const i=s.blocks.indexOf(b);
    if(!t){ if(i>=0) s.blocks.splice(i,1); UI.cursor=Math.min(i,s.blocks.length-1); } else b.text=t;
    save();
    if(t&&!after&&el.isConnected){ const nel=blockEl(s,b,i,'read'); el.replaceWith(nel); $$('textarea[data-memo]',nel).forEach(autosize); renderSide(); if(Clock.secId===s.id) updateKaraoke(); return; }
    refreshBlocks(); if(after) after(i); };
  ta.addEventListener('input',()=>autosize(ta));
  ta.addEventListener('keydown',ev=>{ if(ev.isComposing||ev.keyCode===229) return;
    if(ev.key==='Enter'&&!ev.shiftKey){ ev.preventDefault(); const pos=ta.selectionStart; const before=ta.value.slice(0,pos).trim(), after=ta.value.slice(pos).trim();
      if(!before&&after){ commit(i=>{ s.blocks.splice(i,0,mkBlock('')); s.blocks[i].text=''; refreshBlocks(); startEdit(i); }); return; }
      ta.value=before; commit(i=>{ const nb=mkBlock(after); s.blocks.splice(i+1,0,nb); refreshBlocks(); startEdit(i+1,'start'); }); }
    else if(ev.key==='Escape'){ ev.preventDefault(); commit(); }
    else if(ev.key==='Backspace'&&ta.value===''){ ev.preventDefault(); commit(i=>{ if(i>0) startEdit(i-1); }); }
    else if(ev.key==='ArrowUp'&&ta.selectionStart===0){ const i=s.blocks.indexOf(b); if(i>0){ ev.preventDefault(); commit(()=>startEdit(i-1)); } }
    else if(ev.key==='ArrowDown'&&ta.selectionStart===ta.value.length){ const i=s.blocks.indexOf(b); if(i<s.blocks.length-1){ ev.preventDefault(); commit(()=>startEdit(i+1,'start')); } } });
  ta.addEventListener('blur',()=>commit()); }
function selectBlock(idx){ UI.cursor=idx; const box=$('#blocks'); if(!box) return;

const blocksToText=bs=>bs.map(b=>(b.gap?'\n':'')+b.text).join('\n');

    const k=pool.findIndex(o=>o.text===t); const b=k>=0?pool.splice(k,1)[0]:mkBlock(t); b.gap=gap; out.push(b); gap=false; }
  if(out.length===old.length) out.forEach((b,i)=>{ if(!out.includes(old[i])){ if(b.s==null&&old[i].s!=null){ b.s=old[i].s; b.e=old[i].e; } if(!b.memo&&old[i].memo){ b.memo=old[i].memo; b.memoOpen=old[i].memoOpen; } } });

async function handleScriptFile(f){ const st=$('#impStatus'); const say=(t,err)=>{ if(st){ st.textContent=t; st.classList.toggle('err',!!err); } };

    if(name.endsWith('.json')){ const data=JSON.parse(await f.text()); if(!data.project||!Array.isArray(data.project.sections)) throw new Error('백업 파일 형식이 아니에요.'); await restoreBackup(data); closeModal(); toast('백업을 불러왔어요'); return; }

    say('텍스트 읽는 중…'); let txt=await f.text(); if(/\uFFFD/.test(txt.slice(0,2000))){ try{ txt=new TextDecoder('euc-kr').decode(await f.arrayBuffer()); }catch(e){} }
    showParsed(parseText(txt),f.name);

function renderTracks(){ const box=$('#trackList'); if(!box) return;

    return `<div class="track" data-tid="${t.id}"><div class="track-top"><button class="btn sm" data-prev="${t.id}" aria-label="미리 듣기">▶</button><input type="text" value="${esc(t.name)}" data-tname="${t.id}" aria-label="곡 이름"><button class="btn sm danger" data-tdel="${t.id}">삭제</button></div>
    <div class="track-meta"><span class="num">${t.duration?fmt(t.duration):'–'}</span>${used.length?used.map(s=>`<span class="tag blue">${esc(s.title)}<button data-unlink="${s.id}" aria-label="연결 해제">×</button></span>`).join(''):'<span>연결된 순서 없음</span>'}
      <select data-link="${t.id}" style="max-width:180px"><option value="">＋ 순서에 연결…</option>${free.map(s=>`<option value="${s.id}">${esc(s.title)}</option>`).join('')}</select>
      <button class="btn sm ghost" data-relink="${t.id}">파일 교체</button></div></div>`; }).join('');
  box.onclick=async e=>{ const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.prev){ const u=await trackURL(b.dataset.prev); if(!u){ toast('파일이 없어요. 파일 교체로 다시 연결하세요.'); return; } if(previewA&&!previewA.paused&&previewA._id===b.dataset.prev){ previewA.pause(); b.textContent='▶'; return; } if(previewA) previewA.pause(); Clock.pause(); previewA=new Audio(u); previewA._id=b.dataset.prev; previewA.play(); $$('[data-prev]').forEach(x=>x.textContent='▶'); b.textContent='❚❚'; }
    if(b.dataset.tdel){ const t=P.tracks.find(x=>x.id===b.dataset.tdel); if(!await ask(`“${t.name}”을 삭제할까요?`,'삭제')){ openMusic(); return; } P.tracks=P.tracks.filter(x=>x.id!==t.id); P.sections.forEach(s=>{ if(s.trackId===t.id) s.trackId=null; }); await Store.del('audio',t.id); urlCache.delete(t.id); save(); await Clock.bind(UI.view==='sec'?sec():null); render(); openMusic(); }
    if(b.dataset.unlink){ const s=P.sections.find(x=>x.id===b.dataset.unlink); s.trackId=null; save(); await Clock.bind(UI.view==='sec'?sec():null); render(); renderTracks(); }
    if(b.dataset.relink){ relinkId=b.dataset.relink; $('#fileRelink').click(); } };
  box.onchange=async e=>{ const sel=e.target.closest('[data-link]'); if(sel&&sel.value){ const s=P.sections.find(x=>x.id===sel.value); s.trackId=sel.dataset.link; save(); await Clock.bind(UI.view==='sec'?sec():null); render(); renderTracks(); } };
  box.oninput=e=>{ const inp=e.target.closest('[data-tname]'); if(inp){ const t=P.tracks.find(x=>x.id===inp.dataset.tname); t.name=inp.value; save(); renderDock(); } }; }
let relinkId=null;
$('#fileAudio').addEventListener('change',async e=>{ const fs=[...e.target.files]; e.target.value=''; if(fs.length){ await addAudioFiles(fs); renderTracks(); } });
$('#fileRelink').addEventListener('change',async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f||!relinkId) return; const t=P.tracks.find(x=>x.id===relinkId); await Store.put('audio',t.id,f); if(urlCache.has(t.id)) URL.revokeObjectURL(urlCache.get(t.id)); const u=URL.createObjectURL(f); urlCache.set(t.id,u); t.fileName=f.name; t.duration=await audioDuration(u); if(Clock.trackId===t.id) Clock.trackId=null; save(); await Clock.bind(UI.view==='sec'?sec():null); render(); renderTracks(); toast('파일을 교체했어요'); });

async function exportPdf(o){
  try{ busy('PDF 도구 불러오는 중…');
    await loadFirst(['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js','https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js'],()=>!!window.html2canvas);
    await loadFirst(['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js','https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js'],()=>!!(window.jspdf&&window.jspdf.jsPDF));
    try{ await document.fonts.ready; }catch(e){}
    busy('페이지 나누는 중…'); const pages=buildPdfPages(o);
    const doc=new window.jspdf.jsPDF({orientation:'p',unit:'pt',format:'a4',compress:true});
    for(let i=0;i<pages.length;i++){ busy(`PDF 만드는 중… ${i+1}/${pages.length}`);
      const cv=await window.html2canvas(pages[i],{scale:2,backgroundColor:'#ffffff',logging:false,useCORS:true});
      if(i) doc.addPage(); doc.addImage(cv.toDataURL('image/jpeg',0.9),'JPEG',0,0,595.28,841.89); cv.width=cv.height=1; }
    $('#pdfHost')?.remove();
    const blob=doc.output('blob'); busy();
    const name=`${(P.title||'결혼식').replace(/[\\/:*?"<>|♥❤♡]/g,' ').replace(/\s+/g,' ').trim()} 사회 대본${o.scope==='cur'?' - '+sec().title:''}.pdf`;
    const r=await saveFile(name,blob); if(r==='saved') toast(`PDF ${pages.length}쪽을 저장했어요`); else if(r==='failed') toast('저장하지 못했어요. 다시 시도해 주세요.');
  }catch(e){ console.error(e); busy(); $('#pdfHost')?.remove(); toast(/load/.test(e.message||'')?'PDF 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.':'PDF를 만들지 못했어요: '+(e.message||e),4000); } }
function buildPdfPages(o){ $('#pdfHost')?.remove(); const host=document.createElement('div'); host.id='pdfHost'; host.className='pdf-host'; document.body.appendChild(host);
  const pages=[]; let body=null, keep=null;
  const newPage=()=>{ const pg=document.createElement('div'); pg.className='pp'; pg.style.setProperty('--pf',o.size+'px'); pg.innerHTML=`<div class="pp-head"><span>${esc(P.title||'')}</span><span>사회 대본</span></div><div class="pp-body"></div><div class="pp-foot"></div>`; host.appendChild(pg); pages.push(pg); body=pg.querySelector('.pp-body'); keep=null; };
  const fits=()=>body.scrollHeight<=body.clientHeight+1;
  const add=(html,isKeep)=>{ const t=document.createElement('div'); t.innerHTML=html.trim(); const node=t.firstElementChild; body.appendChild(node);
    if(!fits()&&body.children.length>1){ body.removeChild(node); const carry=keep&&keep.parentNode===body&&body.children.length>1?keep:null; if(carry) body.removeChild(carry); newPage(); if(carry) body.appendChild(carry); body.appendChild(node); }
    keep=isKeep?node:null; };
  newPage();
  const list=o.scope==='cur'?[sec()]:P.sections; const pp=P.people||{};
  if(o.cover&&o.scope!=='cur'){ const et=eventText(false); const kv=[['일시',et?et.ds:''],['장소',pp.venue],['신랑',pp.groom],['신부',pp.bride],['사회자',pp.mc],['주례',pp.officiant]].filter(x=>x[1]);
    add(`<div class="q-cover"><h1>${esc(P.title||'결혼식')}</h1><div class="sub">사회 대본 · ${P.sections.length}개 순서 · 사회자 멘트 약 ${fmtDur(P.sections.reduce((a,s)=>a+estSection(s),0))}</div><div class="q-kv">${kv.map(([k,v])=>`<span>${k}</span><span>${esc(v)}</span>`).join('')}</div></div>`);
    add(`<div class="q-h">진행표 · 큐시트</div>`,true);
    const cg='<colgroup><col style="width:30px"><col style="width:170px"><col style="width:58px"><col><col style="width:70px"></colgroup>';
    add(`<table class="q-t">${cg}<tr><th>#</th><th>순서</th><th>진행</th><th>음악 · 큐</th><th>멘트</th></tr></table>`,true);
    P.sections.forEach((s,i)=>{ const tr=s.trackId&&P.tracks.find(t=>t.id===s.trackId); const cues=s.blocks.filter(b=>btype(b.text)==='cue').map(b=>shownText(b.text)); const est=estSection(s);
      add(`<table class="q-t r">${cg}<tr><td>${i+1}</td><td>${esc(s.title)}</td><td>${ROLE_LABEL[s.role]}</td><td>${tr?esc(tr.name)+'<br>':(s.note?esc(s.note)+'<br>':'')}${cues.map(c=>`<span class="c">● ${esc(c)}</span>`).join('<br>')}</td><td>${est?fmtDur(est):'–'}</td></tr></table>`); });
    if(P.checklist.length){ add(`<div class="q-h">사회자 체크리스트</div>`,true); add(`<div style="font-size:12.5px;line-height:1.8">${P.checklist.map(c=>`${c.done?'☑':'☐'} ${esc(c.text)}`).join('<br>')}</div>`); }
    newPage(); }
  list.forEach((s,si)=>{ if(o.brk&&si>0) newPage();
    const n=P.sections.indexOf(s)+1; const tr=s.trackId&&P.tracks.find(t=>t.id===s.trackId);
    add(`<div class="q-sec"><h2><span class="n">${String(n).padStart(2,'0')}</span>${esc(s.title)}${s.memo?` <span style="font-size:13px;color:#9b9a97;font-weight:500">${esc(s.memo)}</span>`:''}</h2><div class="pr"><span class="${s.role==='off'?'off':''}">${ROLE_LABEL[s.role]}</span>${tr||s.note?`<span class="bgm">♪ ${esc(tr?tr.name:s.note)}</span>`:''}${estSection(s)?`<span>약 ${fmtDur(estSection(s))}</span>`:''}</div></div>`,true);
    if(!s.blocks.length) add(`<div class="q-empty">${s.role==='off'?'주례자 순서 — 사회자 멘트 없음':'멘트 없음'}</div>`);
    s.blocks.forEach(b=>{ const ty=btype(b.text); const txt=esc(shownText(b.text)); const tm=o.time&&b.s!=null?`<span class="tm">${fmt(b.s,true)}–${fmt(b.e,true)}</span>`:'';
      const inner=ty==='cue'?`<span class="p">♪ ${txt}</span>`:txt; const off=s.role==='off'&&(ty==='say'||ty==='shout')?' off':'';
      const memo=o.memo&&b.memo&&b.memo.trim()?`<div class="q-memo"><b>메모</b>${esc(b.memo.trim())}</div>`:'';
      add(`<div><div class="q-b ${ty}${off}${b.gap?' gap':''}">${tm}${inner}</div>${memo}</div>`); });
    if(o.sos&&s.backups&&s.backups.length){ add(`<div class="q-sos-h">변수 상황 대처</div>`,true); s.backups.forEach(b=>add(`<div class="q-sos"><b>${esc(b.title)}</b>${esc(b.text)}</div>`)); } });
  if(o.sos&&o.scope!=='cur'&&P.commonBackups.length){ add(`<div class="q-sec"><h2>공통 비상 멘트</h2></div>`,true); P.commonBackups.forEach(b=>add(`<div class="q-sos"><b>${esc(b.title)}</b>${esc(b.text)}</div>`)); }
  const real=pages.filter(p=>p.querySelector('.pp-body').children.length); pages.filter(p=>!real.includes(p)).forEach(p=>p.remove());
  real.forEach((p,i)=>p.querySelector('.pp-foot').textContent=`${i+1} / ${real.length}`); return real; }
