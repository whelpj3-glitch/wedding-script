<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3f2f7">
<!-- app:start -->
<title>웨딩 MC 큐카드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: cue-card reader — slim order rail on the left, one wide script column, transport docked at the bottom */
:root{
  --bg:#f3f2f7; --surface:#ffffff; --surface-2:#ebe9f2; --line:#dcd9e6;
  --ink:#1c1b29; --ink-2:#55526b; --ink-3:#8b88a0;
  --accent:#3846c9; --accent-ink:#ffffff; --accent-soft:#e4e6fb;
  --kar:#3846c9; --kar-done:#8d94d6;
  --cue:#c8401a; --cue-soft:#fbe8e0;
  --off:#1f7a45; --off-soft:#e0f1e6;
  --adlib:#9a6200; --adlib-soft:#f7eed8;
  --rec:#d2213f;
  --shadow:0 1px 2px rgba(28,27,41,.06),0 10px 30px rgba(28,27,41,.10);
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --f-display:"Gowun Batang","AppleMyungjo","Batang",serif;
  --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --script-size:21px; --stage-size:34px; --dock-h:76px;
  --gut-l:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111219; --surface:#1a1b25; --surface-2:#242635; --line:#30334a;
  --ink:#ecebf4; --ink-2:#adabc2; --ink-3:#77758e;
  --accent:#8f9bff; --accent-ink:#11121a; --accent-soft:#272b52;
  --kar:#a3acff; --kar-done:#5f67a8;
  --cue:#ff8f62; --cue-soft:#3b2219;
  --off:#62d28f; --off-soft:#183324;
  --adlib:#f0b54d; --adlib-soft:#352a13;
  --rec:#ff5470;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111219; --surface:#1a1b25; --surface-2:#242635; --line:#30334a;
  --ink:#ecebf4; --ink-2:#adabc2; --ink-3:#77758e;
  --accent:#8f9bff; --accent-ink:#11121a; --accent-soft:#272b52;
  --kar:#a3acff; --kar-done:#5f67a8;
  --cue:#ff8f62; --cue-soft:#3b2219;
  --off:#62d28f; --off-soft:#183324;
  --adlib:#f0b54d; --adlib-soft:#352a13;
  --rec:#ff5470;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px));scroll-padding-bottom:calc(var(--dock-h) + 24px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--bg)}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--ink-3)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--rec);border-color:var(--line)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.btn svg{width:18px;height:18px;flex:none}
.icon-btn{width:42px;height:42px;padding:0;border-radius:50%}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:12px;max-width:1280px;margin:0 auto;padding-block:10px;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.brand{flex:1;min-width:0}
.brand-title{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub b{color:var(--accent);font-weight:600}
.tb-actions{display:flex;gap:6px;align-items:center}
.narrow-only{display:none}
@media (max-width:959px){
  .wide-only{display:none!important}
  .narrow-only{display:inline-flex}
}
@media (max-width:420px){ .tb-toc span{display:none} .tb-toc{width:40px;padding:0} }

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;max-width:1280px;margin:0 auto;padding-top:20px;padding-left:var(--gut-l);padding-right:var(--gut-r);padding-bottom:calc(var(--dock-h) + 40px + env(safe-area-inset-bottom,0px))}
@media (min-width:960px){
  .layout{grid-template-columns:300px minmax(0,1fr)}
  .toc{position:sticky;top:calc(72px + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100vh - 72px - var(--dock-h) - 40px);overflow:auto;border-radius:16px}
  .toc-head .tb-close{display:none}
}
@media (max-width:959px){
  .toc{position:fixed;top:0;bottom:0;left:0;width:min(88vw,360px);z-index:70;transform:translateX(-104%);transition:transform .25s ease;overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);box-shadow:var(--shadow)}
  .toc.open{transform:none}
}
.backdrop{position:fixed;inset:0;background:rgba(10,10,20,.45);z-index:65}
.toc{background:var(--surface);border:1px solid var(--line)}
.toc-head{display:flex;align-items:flex-start;gap:8px;padding:16px 16px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.toc-head h2{margin:0;font-size:13px;letter-spacing:.08em;color:var(--ink-2);font-weight:600}
.toc-head .meta{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.toc-list{list-style:none;margin:0;padding:6px}
.toc-item{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;padding:9px 10px;border:0;border-radius:10px;background:transparent}
.toc-item:hover{background:var(--surface-2)}
.toc-item.is-cur{background:var(--accent-soft)}
.toc-item.is-cur .toc-n{color:var(--accent)}
.toc-n{font-family:var(--f-num);font-size:12px;color:var(--ink-3)}
.toc-title{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc-sub{display:flex;gap:6px;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden}
.toc-sub .r-off{color:var(--off)}
.toc-badges{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--ink-3)}
.toc-badges .ok{color:var(--off);font-weight:700}
.toc-foot{padding:8px 12px 14px}

/* ---------- section head ---------- */
.main{min-width:0;max-width:820px;width:100%}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:var(--ink);margin-bottom:18px;font-size:14px}
.sec-eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.sec-eyebrow .num{color:var(--ink-3)}
.role{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink-2)}
.role.off{background:var(--off-soft);color:var(--off)}
.sec-title{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,5vw,36px);line-height:1.2;margin:6px 0 4px;text-wrap:balance}
.sec-title small{font-family:var(--f-ui);font-size:14px;font-weight:500;color:var(--ink-3);margin-left:8px;vertical-align:middle}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:5px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.chip b{color:var(--ink);font-weight:600}
.chip.music{border-color:transparent;background:var(--cue-soft);color:var(--cue)}
.chip.music b{color:var(--cue)}
.chip.warn{border-style:dashed}
.chip button{border:0;background:none;color:var(--accent);font-weight:600;padding:0}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sec-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:18px 0 6px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--surface-2);gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-size:14px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.done-btn[aria-pressed="true"]{background:var(--off-soft);border-color:transparent;color:var(--off)}
.hint{font-size:13px;color:var(--ink-3);margin:10px 0 0}

/* ---------- script blocks ---------- */
.blocks{display:flex;flex-direction:column;gap:4px;padding-top:10px}
.blk{position:relative;padding:8px 12px 8px 14px;margin:0 -12px 0 -14px;border-radius:12px;font-size:var(--script-size);line-height:1.72;word-break:keep-all;overflow-wrap:anywhere;--bi:var(--ink);color:var(--bi);transition:background .2s}
.blk.gap{margin-top:14px}
.blk .kt{display:inline}
.blk .kt span.f{color:var(--kar)}
.blk[data-st="done"] .kt span.f{color:var(--kar-done)}
.blk .kt span.c{background-image:linear-gradient(90deg,var(--kar) var(--p,0%),var(--bi) var(--p,0%));-webkit-background-clip:text;background-clip:text;color:transparent}
.blk[data-type="shout"]{font-weight:700}
.blk[data-type="dir"],.blk[data-type="note"]{font-size:calc(var(--script-size)*.72);line-height:1.5;--bi:var(--ink-3);padding-block:4px}
.blk[data-type="note"] .kt::before{content:"※ "}
.blk[data-type="cue"]{font-size:calc(var(--script-size)*.72);line-height:1.5;padding-block:4px}
.blk[data-type="cue"] .cue-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:8px;background:var(--cue-soft);--bi:var(--cue);color:var(--cue);font-weight:600}
.blk[data-type="adlib"] .kt{--bi:var(--adlib);color:var(--adlib)}
.blk[data-type="adlib"] .tag{font-size:12px;font-weight:600;color:var(--adlib);background:var(--adlib-soft);padding:1px 7px;border-radius:6px;margin-right:8px;vertical-align:middle}
.sec-off .blk[data-type="say"],.sec-off .blk[data-type="shout"]{--bi:var(--off)}
.blk.cursor{background:var(--surface-2)}
.blk[data-st="on"]{background:var(--accent-soft)}
.blk[data-st="done"]{--bi:var(--ink-2)}
.blk-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:2px;font-size:12px;line-height:1.4}
.tbadge{display:inline-flex;align-items:center;gap:4px;border:0;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);font-family:var(--f-num);font-size:12px}
button.tbadge:hover{color:var(--accent)}
.cd{display:none;font-family:var(--f-num);font-size:12px;font-weight:600;color:var(--accent)}
.blk[data-st="soon"] .cd{display:inline}
.blk[data-st="soon"]{box-shadow:inset 0 0 0 1.5px var(--accent)}
.empty-off{padding:28px 20px;border:1.5px dashed var(--line);border-radius:14px;text-align:center;color:var(--ink-2)}
.empty-off b{display:block;font-family:var(--f-display);font-size:20px;color:var(--off);margin-bottom:4px}

/* timing mode */
.mode-timing .blk{cursor:pointer;padding-left:40px;margin-left:-14px}
.mode-timing .blk::before{content:"";position:absolute;left:12px;top:calc(var(--script-size)*.45);width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line);background:var(--surface)}
.mode-timing .blk[data-type="dir"]::before,.mode-timing .blk[data-type="note"]::before,.mode-timing .blk[data-type="cue"]::before{top:8px}
.mode-timing .blk.sel{background:var(--accent-soft)}
.mode-timing .blk.sel::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--surface)}
.mode-read .blk{cursor:pointer}
.timeline{position:relative;height:34px;margin:14px 0 4px;border-radius:8px;background:var(--surface-2);overflow:hidden;cursor:pointer;touch-action:none}
.timeline .seg-t{position:absolute;top:6px;bottom:6px;border-radius:4px;background:var(--kar-done);opacity:.75}
.timeline .seg-t.sel{background:var(--accent);opacity:1}
.timeline .ph{position:absolute;top:0;bottom:0;width:2px;background:var(--cue);transform:translateX(-1px)}
.timeline-scale{display:flex;justify-content:space-between;font-family:var(--f-num);font-size:11px;color:var(--ink-3)}

/* editor */
.editor{display:grid;gap:14px;padding-top:12px}
.editor label{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.editor label small{font-weight:400;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.field,.editor input,.editor select,.editor textarea,.modal input[type=text],.modal input[type=datetime-local],.modal select,.modal textarea{width:100%;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;font-weight:400}
.editor textarea{min-height:320px;font-size:16px;line-height:1.7;resize:vertical;word-break:keep-all}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-3)}
.legend code{font-family:var(--f-num);background:var(--surface-2);padding:1px 6px;border-radius:5px;color:var(--ink-2)}
.ops{display:flex;flex-wrap:wrap;gap:8px;padding-top:6px;border-top:1px solid var(--line)}
.ops .grow{flex:1}

.sec-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:34px}
.sec-nav .btn{min-height:56px;justify-content:flex-start;text-align:left;white-space:normal;line-height:1.3;padding:8px 14px}
.sec-nav .btn.next{justify-content:flex-end;text-align:right}
.sec-nav small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:400}

/* ---------- dock ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.06);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock-in{max-width:1280px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.tpanel{padding:12px 0 10px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.tp-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tp-sum{font-size:13px;color:var(--ink-2);flex:1;min-width:0}
.tp-sum b{color:var(--ink)}
.tfield{display:flex;align-items:center;gap:4px;padding:3px 4px 3px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.tfield span{font-size:12px;color:var(--ink-3);white-space:nowrap}
.tfield input{width:76px;border:0;background:transparent;font-family:var(--f-num);font-size:15px;padding:6px 2px;color:var(--ink)}
.tfield input:focus{outline:none}
.tfield .btn{min-height:30px;padding:0 8px;font-size:12px}
.hold{flex:1;min-width:200px;min-height:48px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);font-weight:600;font-size:15px;touch-action:none;user-select:none;-webkit-user-select:none}
.hold.rec{background:var(--rec);color:#fff}
.hold-sub{font-weight:400;opacity:.75;font-size:13px;margin-left:6px}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);white-space:nowrap}
@media (max-width:560px){
  .tpanel{gap:7px;padding:9px 0 8px}
  .tp-sum{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tp-fields{flex-wrap:nowrap}
  .tp-fields .tfield{flex:1 1 0;min-width:0;padding-left:8px}
  .tfield input{width:100%;min-width:0;font-size:14px}
  .tp-btns{gap:6px}
  .tp-btns .btn{padding:0 9px;min-height:32px}
  .hold{min-height:42px;font-size:14px}
  .hold-sub{display:none}
  .blk{font-size:calc(var(--script-size)*.92)}
}
.player{display:flex;align-items:center;gap:10px;min-height:76px;padding-block:8px}
.pl-play{width:50px;height:50px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.pl-play svg{width:22px;height:22px}
.pl-mid{flex:1;min-width:0;display:grid;gap:2px}
.pl-label{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-label small{font-weight:400;color:var(--ink-3)}
.pl-bar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.pl-bar input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.pl-side{display:flex;align-items:center;gap:4px}
.pl-side select{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px;font-size:13px}
@media (max-width:560px){ .pl-side .opt{display:none} }

/* ---------- stage ---------- */
.stage{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column}
.st-top{display:flex;align-items:center;gap:10px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;padding-left:var(--gut-l);padding-right:var(--gut-r);border-bottom:1px solid var(--line);background:var(--surface)}
.st-title{flex:1;min-width:0}
.st-title .t{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,3.6vw,28px);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-title .m{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.st-clock{font-family:var(--f-num);font-size:15px;color:var(--ink-2);text-align:right;line-height:1.2}
.st-clock small{display:block;font-size:11px;color:var(--ink-3)}
.st-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding-top:24px;padding-bottom:40vh;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.st-body .blocks{max-width:980px;margin:0 auto;--script-size:var(--stage-size)}
.st-body .blk{margin-left:-14px;margin-right:-12px}
.st-bot{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:var(--gut-l);padding-right:var(--gut-r);border-top:1px solid var(--line);background:var(--surface)}
.st-next{flex:1;min-width:0;font-size:13px;color:var(--ink-2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-next b{color:var(--ink)}
.st-time{font-family:var(--f-num);font-size:13px;color:var(--ink-2);min-width:46px;text-align:center}

/* ---------- modal ---------- */
.modal-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,10,20,.5)}
@media (min-width:700px){.modal-wrap{align-items:center;padding:24px}}
.modal{width:100%;max-width:680px;max-height:92vh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:var(--shadow);padding:20px var(--gut-r) calc(22px + env(safe-area-inset-bottom,0px)) var(--gut-l)}
@media (min-width:700px){.modal{border-radius:18px;padding:24px 26px}}

.m-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}

.status.err{color:var(--rec)}
.pv-list{list-style:none;margin:10px 0 0;padding:0;border:1px solid var(--line);border-radius:12px;max-height:300px;overflow:auto}
.pv-list li{display:flex;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:14px}
.pv-list li:last-child{border-bottom:0}
.pv-list .n{font-family:var(--f-num);color:var(--ink-3);font-size:12px;padding-top:2px}
.pv-list .x{flex:1;min-width:0}
.pv-list .x small{display:block;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-grid{display:grid;gap:8px;margin-top:10px}
.menu-grid .btn{justify-content:flex-start;min-height:52px;font-size:15px}
.menu-grid .btn small{color:var(--ink-3);font-weight:400;margin-left:auto}
.track{display:grid;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}

.tag-sec button{border:0;background:none;color:var(--ink-3);padding:0 4px}
.set-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.set-row small{display:block;color:var(--ink-3);font-size:12.5px}
.set-row input[type=range]{width:min(200px,40vw);accent-color:var(--accent)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}

.toast{position:fixed;left:50%;bottom:calc(var(--dock-h) + 24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:120;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}

<script>
'use strict';
/* ============================================================
   Utilities
   ============================================================ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(t,dec){ if(t==null||!isFinite(t)) return '–'; const neg=t<0; t=Math.abs(t); let m=Math.floor(t/60), s=t-m*60;
  let ss; if(dec){ ss=s.toFixed(1); if(ss==='60.0'){m++;ss='0.0';} ss=ss.padStart(4,'0'); } else ss=String(Math.floor(s)).padStart(2,'0');
  return (neg?'-':'')+m+':'+ss; }
function fmtDur(t){ t=Math.round(t); if(t<60) return t+'초'; const m=Math.floor(t/60), s=t%60; return s?`${m}분 ${s}초`:`${m}분`; }
function parseTime(str){ str=String(str??'').trim(); if(!str) return null; const m=str.match(/^(\d+)\s*:\s*(\d{1,2}(?:\.\d+)?)$/); if(m) return +m[1]*60 + +m[2]; const n=parseFloat(str.replace(/[^\d.]/g,'')); return isFinite(n)?n:null; }
const median=a=>{ if(!a.length) return 0; const b=[...a].sort((x,y)=>x-y); return b[Math.floor(b.length/2)]; };
function once(el,ev,ms){ return new Promise(res=>{ let done=false; const f=()=>{ if(done) return; done=true; el.removeEventListener(ev,f); res(); }; el.addEventListener(ev,f); setTimeout(f,ms||3000); }); }
let toastT; function toast(msg,ms){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, ms||2400); }
const I={
  play:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>',
  pause:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z" fill="currentColor"/></svg>',
  note:'<svg viewBox="0 0 24 24" aria-hidden="true" width="14" height="14"><path d="M9 18.5a2.5 2.5 0 1 1-2.5-2.5c.9 0 1.7.4 2.5 1V5l10-2v12.5a2.5 2.5 0 1 1-2.5-2.5c.9 0 1.7.4 2.5 1V7.2L9 9z" fill="currentColor"/></svg>'
};

/* ============================================================
   Storage (IndexedDB with in-memory fallback)
   ============================================================ */
const Store={ db:null, mem:{kv:new Map(),audio:new Map()},
  async init(){ try{ this.db=await new Promise((res,rej)=>{ const r=indexedDB.open('wedding-mc',1); r.onupgradeneeded=()=>{ const d=r.result; d.createObjectStore('kv'); d.createObjectStore('audio'); }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); setTimeout(()=>rej(new Error('idb timeout')),3000); }); }catch(e){ this.db=null; } },
  async get(st,k){ if(this.mem[st].has(k)) return this.mem[st].get(k); if(!this.db) return undefined; try{ return await new Promise((res,rej)=>{ const q=this.db.transaction(st).objectStore(st).get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }catch(e){ return undefined; } },
  async put(st,k,v){ this.mem[st].set(k,v); if(!this.db) return; try{ await new Promise((res,rej)=>{ const tx=this.db.transaction(st,'readwrite'); tx.objectStore(st).put(v,k); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); }); }catch(e){ console.warn('save failed',e); if(st==='audio') toast('음악 파일을 기기에 저장하지 못했어요. 이번 접속 동안만 사용됩니다.'); } },
  async del(st,k){ this.mem[st].delete(k); if(!this.db) return; try{ await new Promise((res)=>{ const tx=this.db.transaction(st,'readwrite'); tx.objectStore(st).delete(k); tx.oncomplete=res; tx.onerror=res; }); }catch(e){} }
};

/* ============================================================
   State
   ============================================================ */
let P=null;
const S={fontSize:21, stageSize:34, cps:5, autoScroll:true, theme:'system', rate:1};
const UI={secId:null, mode:'read', selA:null, selB:null, multi:false, cursor:-1, stage:false, hold:null, tocOpen:false};
let saveT;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{ Store.put('kv','project',JSON.parse(JSON.stringify(P))); Store.put('kv','settings',{...S}); },250); }
const sec=()=>P.sections.find(s=>s.id===UI.secId)||P.sections[0];
const secIdx=()=>P.sections.indexOf(sec());
function mkBlock(text,gap){ return {id:uid(), text:String(text).trim(), gap:!!gap, s:null, e:null}; }
function newSection(o={}){ return {id:uid(), title:o.title||'새 순서', memo:o.memo||'', role:o.role||'mc', note:o.note||'', trackId:o.trackId||null, trackStart:o.trackStart||0, done:false,
  blocks:(o.blocks||[]).map(b=>typeof b==='string'?mkBlock(b):b)}; }
const ROLE_LABEL={mc:'사회자', off:'주례자', other:'기타'};

/* block typing — the script's own conventions: (지시문) *음향 큐* ~애드리브~ 구호! */
const CUE_RE=/(ON|OFF|재생|정지|큐|BGM|MR|영상|음악|곡|조명|암전|스톱)/i;
function btype(t){ const s=(t||'').trim();
  if(/^\*.+\*$/.test(s)) return CUE_RE.test(s)?'cue':'note';
  if(/^[※*]/.test(s)) return 'note';
  if(/^\(.*\)$/.test(s)||/^\[.*\]$/.test(s)) return 'dir';
  if(/^~.+~$/.test(s)) return 'adlib';
  if(s.length<=32&&/!$/.test(s)) return 'shout';
  return 'say'; }
const SPOKEN=new Set(['say','shout','adlib']);
function shownText(t){ const ty=btype(t); let s=t.trim(); if(ty==='cue'||(ty==='note'&&/^\*.*\*$/.test(s))) s=s.replace(/^\*+\s*|\s*\*+$/g,''); else if(ty==='note') s=s.replace(/^[※*]\s*/,''); else if(ty==='adlib') s=s.replace(/^~\s*|\s*~$/g,''); return s; }
function spokenLen(t){ return t.replace(/[\s.,!?~*()\[\]…·"'“”‘’\-:;]/g,'').length; }
function estBlock(b){ const ty=btype(b.text); if(!SPOKEN.has(ty)) return 0; if(ty==='adlib') return 8; return spokenLen(b.text)/S.cps+0.5; }
function estSection(s){ return s.role==='off'?0:s.blocks.reduce((a,b)=>a+estBlock(b),0); }
function charW(ch){ if(/\s/.test(ch)) return .35; if(/[.,!?…]/.test(ch)) return 1.5; return 1; }

/* ============================================================
   Parsing — TXT
   ============================================================ */
const HEAD_KW=['하객안내','안내','개식','화촉','점화','입장','맞절','소개','성경','봉독','설교','서약','기도','성혼','선언','선포','축도','축가','축사','인사','행진','폐식','주례','혼인','예물','교환','낭독','영상','케이크','부케','촬영','감사','식전','식후','혼주','편지','답사','덕담'];
function labelToTitle(label){ label=label.replace(/\s+/g,' ').trim(); const m=label.match(/^(.*?)\s*[(（]([^)）]*)[)）]\s*$/); if(m&&m[1]) return {title:m[1].trim(),memo:m[2].trim()}; return {title:label,memo:''}; }
function headingOf(line){ const s=line.trim(); let m;
  if(!s||s.length>40) return null;
  if(btype(s)==='cue') return null;
  if((m=s.match(/^#{1,4}\s*(.+)$/))) return m[1].trim();
  if((m=s.match(/^[\[【<〈《]\s*([^\]】>〉》]{1,24}?)\s*[\]】>〉》]$/))) return m[1].trim();
  if((m=s.match(/^[■□▶▷◆◇●○★☆◎▣►▪]\s*(.{1,24})$/))) return m[1].trim();
  if((m=s.match(/^(?:제\s*)?\d{1,2}\s*(?:[.)]|부|순서)\s*(.{1,22})$/))&&!/(다|요|까)[.?!]?$/.test(m[1])) return m[1].trim();
  const nos=s.replace(/\s/g,'');
  if(s.length<=14&&!/[.?!,，~*]/.test(s)&&!/^\(/.test(s)&&!/(다|요|까)$/.test(s)&&HEAD_KW.some(k=>nos.includes(k))) return s;
  return null; }
function splitSentences(s){ if(s.length<50) return [s];
  const parts=s.replace(/([.?!])\s+(?=\S)/g,'$1\u0001').split('\u0001'); const res=[];
  for(const p of parts){ if(res.length&&(p.length<10||res[res.length-1].length<10)) res[res.length-1]+=' '+p; else res.push(p); }
  return res; }
function splitParts(text){ const out=[];
  const segs=text.split(/(\*[^*]{2,}\*|~[^~]{2,}~)/).map(s=>s.trim()).filter(Boolean);
  for(let s of segs){ if(/^[*~]/.test(s)&&/[*~]$/.test(s)&&s.length>2){ out.push(s); continue; }
    let m; while((m=s.match(/^([(（][^)）]{1,60}[)）])\s*(.+)$/))){ out.push(m[1]); s=m[2]; }
    out.push(...splitSentences(s)); }
  return out.filter(x=>x.trim()); }
function pushText(sec,text,gap){ splitParts(text).forEach((p,i)=>sec.blocks.push(mkBlock(p, i===0&&gap&&sec.blocks.length>0))); }
function addNote(sec,txt){ txt=txt.replace(/\s+/g,' ').trim(); if(!txt) return;
  if(/목사|주례|신부님|스님|담임|법사/.test(txt)){ sec.role='off'; if(/^(목사님|주례자|주례|목사)$/.test(txt)) return; }
  if(/^사회자?$/.test(txt)) { sec.role='mc'; return; }
  sec.note = sec.note ? sec.note+' / '+txt : txt; }
function parseText(text){
  const lines=text.replace(/\r\n?/g,'\n').replace(/ /g,' ').split('\n');
  const hasHeads=lines.some(l=>headingOf(l));
  const sections=[], info=[]; let cur=null, gap=false;
  for(const raw of lines){ const line=raw.trim();
    if(!line){ gap=true; continue; }
    if(raw.includes('\t')){ const cells=raw.split('\t').map(s=>s.trim()); while(cells.length&&!cells[cells.length-1]) cells.pop();
      if(cells.length>=2){ const isLabel=cells[0]&&cells[0].length<=24;
        if(isLabel){ cur=newSection(labelToTitle(cells[0])); sections.push(cur); } else if(!cur){ cur=newSection({title:'도입'}); sections.push(cur); }
        const body=cells.slice(isLabel?1:(cells[0]?0:1));
        if(body[0]) pushText(cur,body[0],gap); if(body.length>1) addNote(cur,body.slice(1).join(' '));
        gap=false; continue; } }
    const h=headingOf(line);
    if(h){ cur=newSection(labelToTitle(h)); sections.push(cur); gap=false; continue; }
    const bg=line.match(/^(bgm|배경음악|음악|입장곡|행진곡|축가곡)\s*[:：-]\s*(.+)$/i);
    if(bg&&cur){ addNote(cur,'Bgm: '+bg[2]); continue; }
    if(!cur){ if(hasHeads){ info.push(line); continue; } cur=newSection({title:'대본'}); sections.push(cur); }
    pushText(cur,line,gap); gap=false; }
  return finishParsed({info, sections, program:[]}); }
function finishParsed(r){
  for(const s of r.sections){
    const pg=r.program&&r.program.find(p=>p.name.replace(/\s/g,'')===s.title.replace(/\s/g,''));
    if(pg&&/주례|목사/.test(pg.who)&&!s.blocks.length) s.role='off';
    if(!s.blocks.length&&/성경|봉독|설교|축도|주례사|기도|성혼|선포|선언|말씀/.test(s.title)&&s.role==='mc') s.role='off'; }
  const all=r.info.join('\n');
  r.title = (r.info.find(l=>/♥|❤|♡|&|＆|결혼/.test(l))||r.info[0]||'').replace(/\s+/g,' ').trim().slice(0,40);
  const m=all.match(/(\d{4})\s*[년.\-/]\s*(\d{1,2})\s*[월.\-/]\s*(\d{1,2})\s*일?[^\n]*?(오전|오후|낮|저녁)?\s*(\d{1,2})\s*(?:시|:)\s*(?:(\d{1,2})\s*분?)?/);
  if(m){ let h=+m[5]; if((m[4]==='오후'||m[4]==='저녁')&&h<12) h+=12; const d=new Date(+m[1],+m[2]-1,+m[3],h,+(m[6]||0)); if(!isNaN(d)) r.eventAt=toLocalISO(d); }
  return r; }
function toLocalISO(d){ const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }

/* ============================================================
   Parsing — PDF (pdf.js text + table rules found on the rendered page)
   ============================================================ */
const PDFJS=[['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'],

    const duration=await audioDuration(u); P.tracks.push({id,name:f.name.replace(/\.[^.]+$/,''),fileName:f.name,duration}); added++; }
  const n=autoMatch(false); save(); await Clock.bind(sec()); render();

/* ============================================================

const Clock={ mode:'watch', trackId:null, secId:null, wBase:0, wStart:0, wOn:false,

    const tr=s&&s.trackId?P.tracks.find(t=>t.id===s.trackId):null; const url=tr?await trackURL(tr.id):null;
    if(url){ if(this.trackId!==tr.id){ audio.pause(); audio.src=url; this.trackId=tr.id; await once(audio,'loadedmetadata',4000); } else audio.pause();
      this.mode='audio'; try{ audio.currentTime=s.trackStart||0; }catch(e){} audio.playbackRate=S.rate; }
    else { audio.pause(); this.mode='watch'; this.trackId=null; }
    kick(); },
  hasTrack(){ return this.mode==='audio'; },
  time(){ return this.mode==='audio'?audio.currentTime:(this.wOn?this.wBase+(performance.now()-this.wStart)/1000*S.rate:this.wBase); },
  playing(){ return this.mode==='audio'?!audio.paused:this.wOn; },
  play(){ if(this.mode==='audio'){ audio.playbackRate=S.rate; audio.play().catch(()=>toast('재생하지 못했어요. 다시 눌러 주세요.')); } else if(!this.wOn){ this.wStart=performance.now(); this.wOn=true; } kick(); },

function prepKar(el,text){ const kt=el.querySelector('.kt'); kt.textContent=''; const spans=[], cum=[]; let acc=0;

function renderBlocks(box,s,stage){ box.className='blocks'; box.id=stage?'':'blocks'; box._sec=s; box.innerHTML='';

function renderTimeline(){ const tl=$('#timeline'); if(!tl) return; const s=sec(); const d=Clock.duration()||60; const a=UI.selA!=null?Math.min(UI.selA,UI.selB):-1, z=UI.selA!=null?Math.max(UI.selA,UI.selB):-1;

/* ----- editor ----- */
const blocksToText=bs=>bs.map(b=>(b.gap?'\n':'')+b.text).join('\n');
function textToBlocks(text,old){ const pool=old.slice(), out=[]; let gap=false;

  if(out.length===old.length) out.forEach((b,i)=>{ if(b.s==null&&old[i].s!=null&&!out.includes(old[i])){ b.s=old[i].s; b.e=old[i].e; } });

function applyTiming(r,st,en){ const sp=r.blocks.filter(b=>SPOKEN.has(btype(b.text))); const list=sp.length&&r.blocks.length>1?sp:r.blocks;

  list.forEach((b,i)=>{ const d=(en-st)*w[i]/W; b.s=+acc.toFixed(2); acc+=d; b.e=+acc.toFixed(2); }); }

const actions={

  secMove:el=>{ flushEditor(); const i=secIdx(), j=i+ +el.dataset.d; if(j<0||j>=P.sections.length) return; const a=P.sections; [a[i],a[j]]=[a[j],a[i]]; save(); render(); },

  secMerge:()=>{ flushEditor(); const i=secIdx(), s=sec(), n=P.sections[i+1]; if(!n){ toast('다음 순서가 없어요'); return; } if(n.blocks.length) n.blocks[0].gap=true; s.blocks.push(...n.blocks); if(n.note) s.note=s.note?s.note+' / '+n.note:n.note; if(!s.trackId) s.trackId=n.trackId; P.sections.splice(i+1,1); save(); render(); toast(`“${n.title}”을 합쳤어요`); },

  tNow:el=>{ $('#'+el.dataset.f).value=fmt(Clock.time(),true); },

  tTry:()=>{ const st=parseTime($('#tStart').value); const r=selRange(); const s0=st!=null?st:(r.blocks[0].s||0); Clock.seek(Math.max(0,s0-2)); Clock.play(); },
  tClear:()=>{ const r=selRange(); r.blocks.forEach(b=>{ b.s=b.e=null; }); save(); renderMain(); renderDock(); renderToc(); },
  tNext:()=>{ const s=sec(); const r=selRange(); let n=r.z+1; while(n<s.blocks.length&&!SPOKEN.has(btype(s.blocks[n].text))) n++; if(n<s.blocks.length){ UI.selA=UI.selB=n; UI.anchor=n; renderMain(); renderDock(); $(`#blocks .blk[data-idx="${n}"]`)?.scrollIntoView({block:'center',behavior:'smooth'}); } },
  import:()=>openImport(), music:()=>openMusic(), overview:()=>openOverview(), settings:()=>openSettings(), menu:()=>openMenu(), closeModal:()=>closeModal()
};
document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(el&&actions[el.dataset.act]){ e.preventDefault(); actions[el.dataset.act](el); return; }
  const blk=e.target.closest('.blk'); if(!blk) return; const idx=+blk.dataset.idx;
  if(blk.closest('#blocks')&&UI.mode==='timing'){ if(UI.multi&&UI.selA!=null){ UI.selB=idx; } else { UI.selA=UI.selB=idx; } $$('#blocks .blk').forEach(x=>{ const i=+x.dataset.idx; x.classList.toggle('sel',i>=Math.min(UI.selA,UI.selB)&&i<=Math.max(UI.selA,UI.selB)); }); renderTimeline(); renderDock(); return; }
  if(blk.dataset.type==='cue'&&Clock.hasTrack()&&!Clock.playing()){ actions.cuePlay(); }
  UI.cursor=idx; markCursor(); });
document.addEventListener('change',e=>{ if(e.target.id==='multiTog'){ UI.multi=e.target.checked; } if(e.target.id==='plRate') Clock.setRate(+e.target.value); });
const seekEl=$('#plSeek'); seekEl.addEventListener('input',()=>{ seeking=true; Clock.seek(seekEl.value/1000*Clock.duration()); }); seekEl.addEventListener('change',()=>{ seeking=false; });
document.addEventListener('pointerdown',e=>{ const tl=e.target.closest('#timeline'); if(!tl) return; const r=tl.getBoundingClientRect(); Clock.seek((e.clientX-r.left)/r.width*Clock.duration()); });
document.addEventListener('keydown',e=>{ if(e.target.matches('input,textarea,select')||$('#modalRoot').firstChild) return;
  if(UI.stage){ if(['ArrowDown','PageDown',' '].includes(e.key)){ e.preventDefault(); moveCursor(1); } else if(['ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); moveCursor(-1); }
    else if(e.key==='ArrowRight'){ stepSection(1); } else if(e.key==='ArrowLeft'){ stepSection(-1); } else if(e.key==='Enter'){ e.preventDefault(); Clock.toggle(); } else if(e.key==='Escape') closeStage(); return; }
  if(UI.mode==='timing'&&e.code==='Space'){ e.preventDefault(); if(!e.repeat) holdStart(); return; }
  if(e.key==='k'||e.key==='K'){ Clock.toggle(); } });
document.addEventListener('keyup',e=>{ if(e.code==='Space'&&UI.hold) holdEnd(); });
(()=>{ let x0=null,y0=0; const b=$('#stBody'); b.addEventListener('touchstart',e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
  b.addEventListener('touchend',e=>{ if(x0==null) return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null; if(Math.abs(dx)>90&&Math.abs(dy)<60) stepSection(dx<0?1:-1); },{passive:true}); })();

function openModal(html){ const root=$('#modalRoot'); root.innerHTML=`<div class="modal-wrap" id="mWrap"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; document.body.classList.add('lock');
  $('#mWrap').addEventListener('click',e=>{ if(e.target.id==='mWrap') closeModal(); }); return root.querySelector('.modal'); }
function closeModal(){ $('#modalRoot').innerHTML=''; if(!UI.stage) document.body.classList.remove('lock'); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&$('#modalRoot').firstChild) closeModal(); });
function ask(msg,ok){ return new Promise(res=>{ const m=openModal(`<h2>확인</h2><p>${esc(msg)}</p><div class="m-actions"><button class="btn" id="aNo">취소</button><button class="btn primary" id="aYes">${esc(ok||'확인')}</button></div>`);
  $('#aNo',m).onclick=()=>{ closeModal(); res(false); }; $('#aYes',m).onclick=()=>{ closeModal(); res(true); }; }); }
const mHead=(t,sub)=>`<div class="m-head"><div><h2>${t}</h2>${sub?`<p>${sub}</p>`:''}</div><button class="btn ghost sm" data-act="closeModal">닫기</button></div>`;

  <button class="btn" data-act="import">대본 불러오기 <small>PDF · TXT · 백업</small></button>

  <button class="btn" data-act="settings">설정 · 백업</button></div>`); }

/* ----- import ----- */
let parsed=null;
function openImport(){ parsed=null; const m=openModal(`${mHead('대본 불러오기','PDF나 TXT를 넣으면 식순별로 나눠서 대본을 만들어요. 표로 된 대본(순서 | 멘트 | 참고)도 인식합니다.')}
  <div class="drop" id="drop"><strong>파일을 여기에 끌어다 놓기</strong><span>PDF · TXT · 백업(JSON)</span><button class="btn primary" id="pick">파일 선택</button></div>
  <details style="margin-top:14px"><summary style="cursor:pointer;font-weight:600">텍스트 직접 붙여넣기</summary>
    <p>순서 이름은 <code>[개식사]</code>, <code>1. 개식사</code>, <code># 개식사</code>처럼 쓰거나 ‘화촉점화’처럼 짧은 줄로 두면 자동으로 나뉩니다.</p>
    <textarea id="pasteTxt" rows="8" placeholder="[개식사]&#10;지금부터 신랑 OOO 군과 신부 OOO 양의 결혼식을 시작하겠습니다.&#10;&#10;[화촉점화]&#10;..."></textarea>
    <div class="m-actions"><button class="btn" id="pasteGo">분석하기</button></div></details>
  <div class="status" id="impStatus"></div><div id="impPreview"></div>`);
  const drop=$('#drop',m); $('#pick',m).onclick=()=>$('#fileScript').click();
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop',e=>{ const f=e.dataTransfer.files[0]; if(f) handleScriptFile(f); });
  $('#pasteGo',m).onclick=()=>{ const t=$('#pasteTxt').value; if(!t.trim()) return; showParsed(parseText(t),'붙여넣은 텍스트'); }; }
$('#fileScript').addEventListener('change',e=>{ const f=e.target.files[0]; e.target.value=''; if(f){ if(!$('#impStatus')) openImport(); handleScriptFile(f); } });
async function handleScriptFile(f){ const st=$('#impStatus'); const say=(t,err)=>{ if(st){ st.textContent=t; st.classList.toggle('err',!!err); } };
  try{ const name=f.name.toLowerCase();
    if(name.endsWith('.json')){ const data=JSON.parse(await f.text()); if(!data.project||!Array.isArray(data.project.sections)) throw new Error('백업 파일 형식이 아니에요.'); await restoreBackup(data); closeModal(); toast('백업을 불러왔어요'); return; }
    if(name.endsWith('.pdf')||f.type==='application/pdf'){ say('PDF 읽는 중…'); const r=await parsePdf(f,say); showParsed(r,f.name); return; }
    say('텍스트 읽는 중…'); let txt=await f.text(); if(/�/.test(txt.slice(0,2000))){ try{ txt=new TextDecoder('euc-kr').decode(await f.arrayBuffer()); }catch(e){} }
    showParsed(parseText(txt),f.name);
  }catch(e){ console.error(e); say(/load https/.test(e.message)?'PDF 분석 도구를 불러오지 못했어요. 인터넷 연결을 확인하거나 TXT로 저장해 넣어 주세요.':('불러오지 못했어요: '+e.message),true); } }
function showParsed(r,src){ parsed=r; parsed.source=src; const st=$('#impStatus'); const pv=$('#impPreview'); if(!pv) return;
  if(!r.sections.length){ st.textContent='순서를 찾지 못했어요. 순서 이름 줄을 [ ]로 감싸서 붙여넣어 보세요.'; st.classList.add('err'); pv.innerHTML=''; return; }
  const nb=r.sections.reduce((a,s)=>a+s.blocks.length,0); st.classList.remove('err');
  st.innerHTML=`<b>${r.sections.length}개 순서</b>, 문장 ${nb}개를 찾았어요.${r.title?` · ${esc(r.title)}`:''}${r.program&&r.program.length?` · 식순표 ${r.program.length}항목`:''}`;
  pv.innerHTML=`<ol class="pv-list">${r.sections.map((s,i)=>{ const f=s.blocks.find(b=>SPOKEN.has(btype(b.text))); return `<li><span class="n">${String(i+1).padStart(2,'0')}</span><span class="x"><b>${esc(s.title)}</b> ${s.role==='off'?'<span class="role off">주례자</span>':''} <small>${s.blocks.length}문장${s.note?' · ♪ '+esc(s.note):''}${f?' · '+esc(shownText(f.text).slice(0,40)):''}</small></span></li>`; }).join('')}</ol>
  <div class="m-actions"><button class="btn" data-act="closeModal">취소</button><button class="btn primary" id="impApply">이 대본으로 바꾸기</button></div>
  <p style="font-size:12.5px">지금 대본은 바뀌지만, 넣어 둔 음악은 그대로 두고 메모(BGM 이름)에 맞춰 자동 연결합니다. 순서·문장은 나중에 편집 탭에서 고칠 수 있어요.</p>`;
  $('#impApply').onclick=async()=>{ const tracks=P.tracks||[]; P={version:1,title:r.title||'우리 결혼식',info:r.info||[],eventAt:r.eventAt||null,program:r.program||[],sections:r.sections,tracks,sample:false,source:src};
    const n=autoMatch(false); save(); closeModal(); UI.mode='read'; await goSec(P.sections[0].id); toast(`대본을 만들었어요${n?` · 음악 ${n}곡 자동 연결`:''}`); }; }

/* ----- music ----- */
let previewA=null;
function openMusic(){ const m=openModal(`${mHead('음악','입장·행진곡을 넣어 두면 대본과 함께 연습할 수 있어요. 파일은 이 기기 브라우저에만 저장됩니다.')}
  <div class="m-actions" style="justify-content:flex-start;margin-top:4px"><button class="btn primary" id="addAud">＋ 음악 파일 추가</button><button class="btn" id="reMatch">메모 기준 자동 연결</button></div>
  <div id="trackList" style="margin-top:8px"></div>`);
  $('#addAud',m).onclick=()=>$('#fileAudio').click();
  $('#reMatch',m).onclick=async()=>{ const n=autoMatch(true); save(); await Clock.bind(sec()); render(); renderTracks(); toast(n?`${n}개 순서에 연결했어요`:'새로 연결할 순서가 없어요'); };
  renderTracks(); }
function renderTracks(){ const box=$('#trackList'); if(!box) return;
  if(!P.tracks.length){ box.innerHTML=`<p>아직 음악이 없어요. 대본의 참고 메모(예: <i>Bgm: Ed sheeran - Photograph</i>)와 파일 이름이 비슷하면 자동으로 순서에 연결됩니다.</p>`; return; }
  box.innerHTML=P.tracks.map(t=>{ const used=P.sections.filter(s=>s.trackId===t.id); const free=P.sections.filter(s=>s.trackId!==t.id);
    return `<div class="track" data-tid="${t.id}"><div class="track-top"><button class="btn sm" data-prev="${t.id}" aria-label="미리 듣기">▶</button><input type="text" value="${esc(t.name)}" data-tname="${t.id}" aria-label="곡 이름"><button class="btn sm danger" data-tdel="${t.id}">삭제</button></div>
    <div class="track-meta"><span class="num">${t.duration?fmt(t.duration):'–'}</span><span>·</span>${used.length?used.map(s=>`<span class="tag-sec">${esc(s.title)}<button data-unlink="${s.id}" aria-label="연결 해제">×</button></span>`).join(''):'<span>연결된 순서 없음</span>'}
      <select data-link="${t.id}" style="max-width:180px"><option value="">＋ 순서에 연결…</option>${free.map(s=>`<option value="${s.id}">${esc(s.title)}</option>`).join('')}</select>
      <button class="btn sm ghost" data-relink="${t.id}">파일 교체</button></div></div>`; }).join('');
  box.onclick=async e=>{ const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.prev){ const u=await trackURL(b.dataset.prev); if(!u){ toast('파일이 없어요. 파일 교체로 다시 연결하세요.'); return; } if(previewA&&!previewA.paused&&previewA._id===b.dataset.prev){ previewA.pause(); b.textContent='▶'; return; } if(previewA) previewA.pause(); Clock.pause(); previewA=new Audio(u); previewA._id=b.dataset.prev; previewA.play(); $$('[data-prev]').forEach(x=>x.textContent='▶'); b.textContent='❚❚'; }
    if(b.dataset.tdel){ const t=P.tracks.find(x=>x.id===b.dataset.tdel); if(!await ask(`“${t.name}”을 삭제할까요?`,'삭제')){ openMusic(); return; } P.tracks=P.tracks.filter(x=>x.id!==t.id); P.sections.forEach(s=>{ if(s.trackId===t.id) s.trackId=null; }); await Store.del('audio',t.id); urlCache.delete(t.id); save(); await Clock.bind(sec()); render(); openMusic(); }
    if(b.dataset.unlink){ const s=P.sections.find(x=>x.id===b.dataset.unlink); s.trackId=null; save(); await Clock.bind(sec()); render(); renderTracks(); }
    if(b.dataset.relink){ relinkId=b.dataset.relink; $('#fileRelink').click(); } };
  box.onchange=async e=>{ const sel=e.target.closest('[data-link]'); if(sel&&sel.value){ const s=P.sections.find(x=>x.id===sel.value); s.trackId=sel.dataset.link; save(); await Clock.bind(sec()); render(); renderTracks(); } };
  box.oninput=e=>{ const inp=e.target.closest('[data-tname]'); if(inp){ const t=P.tracks.find(x=>x.id===inp.dataset.tname); t.name=inp.value; save(); renderDock(); } }; }
let relinkId=null;
$('#fileAudio').addEventListener('change',async e=>{ const fs=[...e.target.files]; e.target.value=''; if(fs.length){ await addAudioFiles(fs); renderTracks(); } });
$('#fileRelink').addEventListener('change',async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f||!relinkId) return; const t=P.tracks.find(x=>x.id===relinkId); await Store.put('audio',t.id,f); if(urlCache.has(t.id)) URL.revokeObjectURL(urlCache.get(t.id)); const u=URL.createObjectURL(f); urlCache.set(t.id,u); t.fileName=f.name; t.duration=await audioDuration(u); if(Clock.trackId===t.id) Clock.trackId=null; save(); await Clock.bind(sec()); render(); renderTracks(); toast('파일을 교체했어요'); });

/* ----- overview / cue sheet ----- */
function openOverview(){ const tot=P.sections.reduce((a,s)=>a+estSection(s),0);
  const rows=P.sections.map((s,i)=>{ const cues=s.blocks.filter(b=>btype(b.text)==='cue').map(b=>shownText(b.text)); const tr=s.trackId&&P.tracks.find(t=>t.id===s.trackId); const est=estSection(s);
    return `<tr data-act="goSec" data-sec="${s.id}"><td class="num">${i+1}</td><td><b>${esc(s.title)}</b>${s.done?' <span style="color:var(--off)">✓</span>':''}</td><td>${ROLE_LABEL[s.role]}</td><td>${tr?`♪ ${esc(tr.name)}<br>`:''}${s.note&&!tr?`<span style="color:var(--ink-3)">${esc(s.note)}</span><br>`:''}${cues.map(c=>`<span class="cue">● ${esc(c)}</span>`).join('<br>')}</td><td class="num">${est?fmtDur(est):'–'}</td></tr>`; }).join('');
  openModal(`${mHead(esc(P.title||'예식 개요'),P.eventAt?eventText():'')}
    ${P.info&&P.info.length?`<div class="info-lines">${esc(P.info.join('\n'))}</div>`:''}
    <h3>진행 흐름 · 큐시트</h3><div class="tbl-wrap"><table class="cs"><thead><tr><th>#</th><th>순서</th><th>진행</th><th>음악 · 큐</th><th>멘트</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p>사회자 멘트 예상 합계 <b>${fmtDur(tot)}</b> (초당 ${S.cps}글자 기준, 주례·축가·음악 시간 제외). 행을 누르면 그 순서로 이동해요.</p>
    ${P.program&&P.program.length?`<h3>원본 식순표</h3><div class="tbl-wrap"><table class="cs" style="min-width:0"><thead><tr><th>No.</th><th>식순</th><th>참고</th></tr></thead><tbody>${P.program.map(p=>`<tr><td class="num">${p.no}</td><td>${esc(p.name)}</td><td>${esc(p.who)}</td></tr>`).join('')}</tbody></table></div>`:''}
    <div class="m-actions"><button class="btn" id="copyAll">전체 대본 텍스트 복사</button></div>`);
  $('#copyAll').onclick=()=>copyText(P.sections.map(s=>`[${s.title}]${s.note?'\nBgm: '+s.note.replace(/^bgm\s*:\s*/i,''):''}\n${blocksToText(s.blocks)}`).join('\n\n'),'전체 대본을 복사했어요'); }
function copyText(txt,msg){ const fallback=()=>{ const m=openModal(`${mHead('복사하기','아래 내용을 전체 선택해서 복사하세요.')}<textarea rows="12" id="cpTxt" readonly>${esc(txt)}</textarea>`); const t=$('#cpTxt',m); t.focus(); t.select(); };
  try{ navigator.clipboard.writeText(txt).then(()=>toast(msg)).catch(fallback); }catch(e){ fallback(); } }

/* ----- settings & backup ----- */
function openSettings(){ const m=openModal(`${mHead('설정')}
  <div class="set-row"><div>대본 글자 크기<small>읽기·타이밍 화면</small></div><input type="range" id="sFont" min="15" max="34" value="${S.fontSize}"></div>
  <div class="set-row"><div>무대 모드 글자 크기<small>무대에서 멀리 두고 볼 때 크게</small></div><input type="range" id="sStage" min="22" max="72" value="${S.stageSize}"></div>
  <div class="set-row"><div>읽기 속도 <b class="num" id="cpsV">${S.cps}</b>글자/초<small>예상 시간과 ‘예상’ 버튼 계산에 쓰여요. 보통 4.5–5.5</small></div><input type="range" id="sCps" min="3" max="8" step="0.5" value="${S.cps}"></div>
  <div class="set-row"><div>재생 중 자동 스크롤<small>읽을 문장을 화면 가운데로</small></div><input type="checkbox" id="sAuto" ${S.autoScroll?'checked':''}></div>
  <div class="set-row"><div>화면 테마</div><select id="sTheme"><option value="system">기기 설정 따름</option><option value="light">밝게</option><option value="dark">어둡게</option></select></div>
  <h3>예식 정보</h3>
  <div class="set-row"><div style="grid-column:1/-1;display:grid;gap:8px"><label>제목<input type="text" id="sTitle" value="${esc(P.title||'')}"></label><label>예식 일시 <small>(D-day·남은 시간 표시)</small><input type="datetime-local" id="sWhen" value="${esc(P.eventAt||'')}"></label></div></div>
  <h3>백업 · 다른 기기로 옮기기</h3>
  <p>대본·타이밍을 파일로 저장해 휴대폰↔태블릿으로 옮길 수 있어요. 음악 파일은 각 기기에서 다시 넣어 주세요.</p>
  <div class="m-actions" style="justify-content:flex-start"><button class="btn" id="bSave">백업 파일 저장</button><button class="btn" id="bCopy">백업 내용 복사</button><button class="btn" id="bLoad">백업 불러오기</button></div>
  <h3>초기화</h3><div class="m-actions" style="justify-content:flex-start"><button class="btn" id="bSample">예시 대본 열기</button><button class="btn danger" id="bReset">모든 데이터 지우기</button></div>`);
  $('#sTheme',m).value=S.theme;
  $('#sFont',m).oninput=e=>{ S.fontSize=+e.target.value; applySettings(); save(); };
  $('#sStage',m).oninput=e=>{ S.stageSize=+e.target.value; applySettings(); save(); };
  $('#sCps',m).oninput=e=>{ S.cps=+e.target.value; $('#cpsV').textContent=S.cps; save(); renderToc(); renderTop(); };
  $('#sAuto',m).onchange=e=>{ S.autoScroll=e.target.checked; save(); };
  $('#sTheme',m).onchange=e=>{ S.theme=e.target.value; applySettings(); save(); };
  $('#sTitle',m).oninput=e=>{ P.title=e.target.value; save(); renderTop(); };
  $('#sWhen',m).onchange=e=>{ P.eventAt=e.target.value||null; save(); renderTop(); };
  const data=()=>JSON.stringify({app:'wedding-mc',version:1,savedAt:new Date().toISOString(),project:P,settings:S});
  $('#bSave',m).onclick=()=>{ try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data()],{type:'application/json'})); a.download=`MC대본백업-${toLocalISO(new Date()).slice(0,10)}.json`; document.body.appendChild(a); a.click(); a.remove(); toast('저장을 시작했어요. 안 되면 ‘백업 내용 복사’를 쓰세요.',3500); }catch(e){ copyText(data(),'백업 내용을 복사했어요'); } };
  $('#bCopy',m).onclick=()=>copyText(data(),'백업 내용을 복사했어요. 메모 앱 등에 붙여넣어 두세요.');
  $('#bLoad',m).onclick=()=>{ const mm=openModal(`${mHead('백업 불러오기')}<div class="m-actions" style="justify-content:flex-start"><button class="btn primary" id="blFile">백업 파일 선택</button></div><p>또는 복사해 둔 백업 내용을 붙여넣으세요.</p><textarea id="blTxt" rows="6"></textarea><div class="m-actions"><button class="btn" id="blGo">불러오기</button></div><div class="status" id="impStatus"></div>`);
    $('#blFile',mm).onclick=()=>$('#fileScript').click();
    $('#blGo',mm).onclick=async()=>{ try{ const d=JSON.parse($('#blTxt').value); if(!d.project) throw 0; await restoreBackup(d); closeModal(); toast('백업을 불러왔어요'); }catch(e){ $('#impStatus').textContent='백업 내용을 읽지 못했어요. 전체를 그대로 붙여넣었는지 확인하세요.'; $('#impStatus').classList.add('err'); } }; };
  $('#bSample',m).onclick=async()=>{ if(!P.sample&&!await ask('지금 대본 대신 예시 대본을 열까요? (음악은 유지)','예시 열기')) return; const tr=P.tracks; P=sampleProject(); P.tracks=tr; save(); closeModal(); await goSec(P.sections[0].id); };
  $('#bReset',m).onclick=async()=>{ if(!await ask('대본, 타이밍, 음악 파일을 이 기기에서 모두 지울까요? 되돌릴 수 없어요.','모두 지우기')) return; for(const t of P.tracks) await Store.del('audio',t.id); urlCache.clear(); P=sampleProject(); save(); await goSec(P.sections[0].id); toast('초기화했어요'); }; }
async function restoreBackup(d){ const keep=P.tracks; P=d.project; P.tracks=P.tracks||[]; const have=new Set(keep.map(t=>t.id)); for(const t of keep) if(!P.tracks.some(x=>x.id===t.id)) P.tracks.push(t);
  if(d.settings) Object.assign(S,d.settings); applySettings(); save(); UI.mode='read'; await goSec(P.sections[0].id); }
function applySettings(){ const r=document.documentElement; r.style.setProperty('--script-size',S.fontSize+'px'); r.style.setProperty('--stage-size',S.stageSize+'px');
  if(S.theme==='system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',S.theme); }

/* ============================================================
   Boot
   ============================================================ */
(async function boot(){
  await Store.init();
  try{ const s=await Store.get('kv','settings'); if(s) Object.assign(S,s); }catch(e){}
  try{ P=await Store.get('kv','project'); }catch(e){ P=null; }
  if(!P||!Array.isArray(P.sections)||!P.sections.length) P=sampleProject();
  P.tracks=P.tracks||[];
  applySettings(); UI.secId=P.sections[0].id;
  await Clock.bind(sec()); render();
  setInterval(()=>{ renderTop(); updateClock(); },30000);
  window.addEventListener('resize',()=>document.documentElement.style.setProperty('--dock-h',Math.max(76,$('#dock').offsetHeight)+'px'));
})();
</script>
